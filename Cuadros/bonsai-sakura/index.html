<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bonsái de Sakura</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #FCE7F3 0%, #FBCFE8 55%, #F9A8D4 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        .bonsai {
            transform-box: view-box;
            transform-origin: 45px 132px;
            animation: respirar 6s ease-in-out infinite;
        }
        @keyframes respirar {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.015); }
        }

        .copa {
            transform-box: view-box;
            transform-origin: 45px 65px;
            animation: copaMecer 5s ease-in-out infinite;
        }
        @keyframes copaMecer {
            0%, 100% { transform: rotate(-1.2deg); }
            50%      { transform: rotate(1.2deg); }
        }

        .flor-brillo {
            animation: florBrillo 3s ease-in-out infinite;
        }
        .flor-brillo:nth-child(2n) { animation-delay: 0.7s; }
        .flor-brillo:nth-child(3n) { animation-delay: 1.4s; }
        @keyframes florBrillo {
            0%, 100% { opacity: 0.75; }
            50%      { opacity: 1; }
        }

        /* Pétalos SVG cayendo dentro del cuadro (fix del bug) */
        .petalo-falling {
            transform-box: fill-box;
            transform-origin: center;
            animation: petaloCaer linear infinite;
        }
        @keyframes petaloCaer {
            0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.95; }
            85%  { opacity: 0.7; }
            100% { transform: translate(-14px, 105px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
<svg id="sk-svg" viewBox="0 0 90 160"
     preserveAspectRatio="xMidYMid slice"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="sk-luz" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Luz suave detrás del árbol -->
    <circle cx="45" cy="65" r="42" fill="url(#sk-luz)" opacity="0.7"/>

    <!-- Suelo rosa -->
    <path d="M0,138 Q25,132 45,136 T90,134 L90,160 L0,160 Z"
          fill="#BE185D" opacity="0.35"/>

    <!-- ============ BONSÁI ============ -->
    <g class="bonsai">

        <!-- Tronco principal con S-curve más marcada -->
        <path d="M40,122 C36,110 42,98 44,88 C47,78 50,72 46,66"
              stroke="#78350F" stroke-width="4.5"
              fill="none" stroke-linecap="round"/>
        <!-- Rama derecha -->
        <path d="M44,92 C52,88 60,84 64,76"
              stroke="#78350F" stroke-width="2.2"
              fill="none" stroke-linecap="round"/>
        <!-- Rama izquierda -->
        <path d="M38,108 C32,104 28,98 28,92"
              stroke="#78350F" stroke-width="2"
              fill="none" stroke-linecap="round"/>
        <!-- Rama baja -->
        <path d="M41,116 C36,114 32,116 28,120"
              stroke="#78350F" stroke-width="1.6"
              fill="none" stroke-linecap="round"/>

        <!-- Copa: capas de follaje rosa -->
        <g class="copa">
            <!-- Capa base: manchas grandes -->
            <g fill="#F9A8D4">
                <circle class="flor-brillo" cx="45" cy="60" r="12"/>
                <circle class="flor-brillo" cx="32" cy="70" r="9"/>
                <circle class="flor-brillo" cx="60" cy="72" r="9"/>
                <circle class="flor-brillo" cx="54" cy="54" r="8"/>
                <circle class="flor-brillo" cx="36" cy="56" r="7"/>
            </g>
            <!-- Capa media: manchitas más claras -->
            <g fill="#FBCFE8">
                <circle class="flor-brillo" cx="42" cy="58" r="4"/>
                <circle class="flor-brillo" cx="56" cy="62" r="4"/>
                <circle class="flor-brillo" cx="30" cy="68" r="3.5"/>
                <circle class="flor-brillo" cx="64" cy="74" r="3.5"/>
                <circle class="flor-brillo" cx="48" cy="52" r="3"/>
                <circle class="flor-brillo" cx="36" cy="72" r="3"/>
            </g>
            <!-- Capa alta: florecitas individuales -->
            <g fill="#FFF1F2" opacity="0.95">
                <circle cx="46" cy="50" r="1.5"/>
                <circle cx="40" cy="60" r="1.3"/>
                <circle cx="54" cy="56" r="1.4"/>
                <circle cx="62" cy="66" r="1.2"/>
                <circle cx="28" cy="72" r="1.2"/>
                <circle cx="50" cy="68" r="1.1"/>
                <circle cx="36" cy="48" r="1.1"/>
            </g>
        </g>

        <!-- Maceta -->
        <path d="M28,122 H64 L60,136 H32 Z" fill="#92400E"/>
        <rect x="26" y="119" width="40" height="5" rx="2" fill="#B45309"/>
        <ellipse cx="46" cy="119" rx="20" ry="1.8" fill="#451A03" opacity="0.75"/>
        <!-- Tierra dentro de la maceta -->
        <ellipse cx="46" cy="121" rx="17" ry="1.4" fill="#3F1A03"/>
    </g>
</svg>

<script>
    // ============================================================
    //  Pétalos cayendo (SVG-based, dentro del cuadro)
    // ============================================================
    (function () {
        'use strict';

        const svg = document.getElementById('sk-svg');
        if (!svg) return;

        const NS = 'http://www.w3.org/2000/svg';
        const TOTAL = 12;

        for (let i = 0; i < TOTAL; i++) {
            const p = document.createElementNS(NS, 'ellipse');
            p.setAttribute('cx', 15 + Math.random() * 60);
            p.setAttribute('cy', 45 + Math.random() * 25);
            p.setAttribute('rx', 1.4 + Math.random() * 0.7);
            p.setAttribute('ry', 0.9 + Math.random() * 0.4);
            p.setAttribute('fill', i % 2 === 0 ? '#FBCFE8' : '#F9A8D4');
            p.setAttribute('opacity', '0.9');
            p.classList.add('petalo-falling');
            p.style.animationDelay = (Math.random() * 10) + 's';
            p.style.animationDuration = (5 + Math.random() * 4) + 's';
            svg.appendChild(p);
        }
    })();
</script>
</body>
</html>
