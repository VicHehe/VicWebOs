<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cactus Sonriente</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #FEF3C7 0%, #FDBA74 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        .cactus {
            transform-box: view-box;
            transform-origin: 45px 138px;
            animation: balanceo 5s ease-in-out infinite;
        }
        @keyframes balanceo {
            0%, 100% { transform: rotate(-1.5deg); }
            50%      { transform: rotate(1.5deg); }
        }

        .flor {
            transform-box: fill-box;
            transform-origin: center;
            animation: florGira 6s ease-in-out infinite;
        }
        @keyframes florGira {
            0%, 100% { transform: rotate(-8deg) scale(1); }
            50%      { transform: rotate(8deg)  scale(1.1); }
        }

        /* OJO PARPADEANTE — ahora sí gira sobre sí mismo */
        .parpado {
            transform-box: fill-box;
            transform-origin: center;
            animation: parpadeo 4.5s ease-in-out infinite;
        }
        @keyframes parpadeo {
            0%, 42%, 58%, 100% { transform: scaleY(1); }
            48%, 52%           { transform: scaleY(0.08); }
        }

        .sol {
            transform-box: fill-box;
            transform-origin: center;
            animation: solPulso 4s ease-in-out infinite;
        }
        @keyframes solPulso {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.08); }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

    <!-- Sol con halo -->
    <circle cx="72" cy="30" r="14" fill="#FCD34D" opacity="0.25"/>
    <circle class="sol" cx="72" cy="30" r="9" fill="#FCD34D"/>

    <!-- Dunas -->
    <path d="M0,118 Q25,104 50,116 T90,112 L90,160 L0,160 Z"
          fill="#F59E0B" opacity="0.55"/>
    <path d="M0,132 Q30,124 60,134 T90,130 L90,160 L0,160 Z"
          fill="#D97706" opacity="0.6"/>

    <g class="cactus">
        <!-- Brazo izquierdo -->
        <rect x="24" y="88" width="7" height="22" rx="3.5" fill="#22C55E"/>
        <rect x="26" y="102" width="12" height="7" rx="3.5" fill="#22C55E"/>

        <!-- Brazo derecho -->
        <rect x="59" y="78" width="7" height="22" rx="3.5" fill="#22C55E"/>
        <rect x="52" y="92" width="12" height="7" rx="3.5" fill="#22C55E"/>

        <!-- Cuerpo principal -->
        <rect x="36" y="70" width="18" height="68" rx="9"
              fill="#22C55E" stroke="#15803D" stroke-width="0.6"/>
        <!-- Brillo vertical -->
        <rect x="39" y="78" width="3" height="42" rx="1.5"
              fill="white" opacity="0.28"/>

        <!-- Espinitas -->
        <g stroke="#FEF9C3" stroke-width="0.5" stroke-linecap="round">
            <line x1="40" y1="76" x2="38" y2="74"/>
            <line x1="50" y1="82" x2="52" y2="80"/>
            <line x1="38" y1="120" x2="36" y2="118"/>
            <line x1="52" y1="124" x2="54" y2="122"/>
            <line x1="26" y1="92"  x2="24" y2="90"/>
            <line x1="66" y1="84"  x2="68" y2="82"/>
            <line x1="40" y1="130" x2="38" y2="132"/>
            <line x1="50" y1="132" x2="52" y2="134"/>
        </g>

        <!-- Carita -->
        <ellipse cx="37.5" cy="103" rx="2" ry="1.2" fill="#FBCFE8" opacity="0.85"/>
        <ellipse cx="52.5" cy="103" rx="2" ry="1.2" fill="#FBCFE8" opacity="0.85"/>

        <!-- Ojos (cada uno escala sobre sí mismo) -->
        <ellipse class="parpado" cx="41" cy="97" rx="1.8" ry="2.2" fill="#14532D"/>
        <ellipse class="parpado" cx="49" cy="97" rx="1.8" ry="2.2" fill="#14532D"/>

        <!-- Sonrisa -->
        <path d="M41,104 Q45,108 49,104"
              stroke="#14532D" stroke-width="0.7"
              fill="none" stroke-linecap="round"/>

        <!-- Flor en la punta (gira suave) -->
        <g class="flor">
            <circle cx="41" cy="66" r="2.5" fill="#F472B6"/>
            <circle cx="49" cy="66" r="2.5" fill="#F472B6"/>
            <circle cx="45" cy="62" r="2.5" fill="#F472B6"/>
            <circle cx="45" cy="66" r="2"   fill="#FDE047"/>
        </g>
    </g>

    <!-- Maceta -->
    <path d="M32,136 H58 L55,152 H35 Z" fill="#B45309"/>
    <rect x="31" y="134" width="28" height="4" rx="1" fill="#92400E"/>
    <ellipse cx="45" cy="134" rx="14" ry="1.2" fill="#451A03" opacity="0.6"/>
</svg>
</body>
</html>
