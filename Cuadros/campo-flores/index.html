<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Campo de Flores</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #DBEAFE 0%, #BFDBFE 40%, #DCFCE7 65%, #BBF7D0 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        /* Sol brillando */
        .sol {
            transform-box: view-box;
            transform-origin: 72px 32px;
            animation: solLatir 4s ease-in-out infinite;
        }
        @keyframes solLatir {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50%      { opacity: 1;    transform: scale(1.08); }
        }

        /* Nubes que se desplazan */
        .nubes {
            animation: nubesMover 18s linear infinite;
        }
        @keyframes nubesMover {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-30px); }
        }

        /* Cada flor se mece con un ritmo levemente distinto */
        .flor { transform-box: view-box; }
        .flor-1 { transform-origin: 20px 130px; animation: mecer 3s ease-in-out infinite; }
        .flor-2 { transform-origin: 32px 135px; animation: mecer 3.6s ease-in-out infinite; animation-delay: 0.4s; }
        .flor-3 { transform-origin: 45px 128px; animation: mecer 3.2s ease-in-out infinite; animation-delay: 0.8s; }
        .flor-4 { transform-origin: 58px 132px; animation: mecer 3.4s ease-in-out infinite; animation-delay: 1.2s; }
        .flor-5 { transform-origin: 72px 130px; animation: mecer 3.8s ease-in-out infinite; animation-delay: 0.6s; }
        @keyframes mecer {
            0%, 100% { transform: rotate(-3deg); }
            50%      { transform: rotate(3deg); }
        }

        /* Mariposa */
        .mariposa {
            animation: mariposaVuelo 8s ease-in-out infinite;
        }
        @keyframes mariposaVuelo {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(15px, -8px); }
            50%  { transform: translate(20px, -3px); }
            75%  { transform: translate(8px, -10px); }
            100% { transform: translate(0, 0); }
        }
        .alas-mariposa {
            transform-box: fill-box;
            animation: alasAleteo 0.3s ease-in-out infinite;
        }
        .alas-mariposa.der {
            transform-origin: right center;
            animation-name: alasAleteoDer;
        }
        .alas-mariposa.izq {
            transform-origin: left center;
        }
        @keyframes alasAleteo {
            0%, 100% { transform: scaleX(1); }
            50%      { transform: scaleX(0.4); }
        }
        @keyframes alasAleteoDer {
            0%, 100% { transform: scaleX(1); }
            50%      { transform: scaleX(0.4); }
        }

        /* Pasto con brisa */
        .pasto {
            animation: pastoOnda 4s ease-in-out infinite;
        }
        @keyframes pastoOnda {
            0%, 100% { opacity: 0.9; }
            50%      { opacity: 1; }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="cf-sol" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FFFBEB"/>
            <stop offset="1" stop-color="#FCD34D"/>
        </radialGradient>
        <radialGradient id="cf-solGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FCD34D" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#FCD34D" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="cf-hill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4ADE80"/>
            <stop offset="1" stop-color="#15803D"/>
        </linearGradient>
    </defs>

    <!-- Sol con glow -->
    <circle cx="72" cy="32" r="22" fill="url(#cf-solGlow)"/>
    <circle class="sol" cx="72" cy="32" r="10" fill="url(#cf-sol)"/>

    <!-- Nubes -->
    <g class="nubes" fill="white" opacity="0.85">
        <ellipse cx="18" cy="30" rx="14" ry="4"/>
        <ellipse cx="14" cy="28" rx="6" ry="3"/>
        <ellipse cx="26" cy="29" rx="5" ry="2.5"/>
        <ellipse cx="52" cy="22" rx="10" ry="3"/>
        <ellipse cx="60" cy="24" rx="6" ry="2.5"/>
    </g>

    <!-- Pajaritos lejanos -->
    <g stroke="#1E3A8A" stroke-width="0.5" fill="none" opacity="0.6">
        <path d="M30,50 Q32,48 34,50 Q36,48 38,50"/>
        <path d="M44,44 Q45.5,42.5 47,44"/>
    </g>

    <!-- Colina de fondo -->
    <path d="M0,105 Q22,92 45,100 T90,98 L90,160 L0,160 Z"
          fill="#86EFAC" opacity="0.55"/>

    <!-- Colina principal -->
    <path d="M0,120 Q30,108 60,118 T90,115 L90,160 L0,160 Z"
          fill="url(#cf-hill)"/>

    <!-- Flores -->
    <g class="flor flor-1">
        <line x1="20" y1="130" x2="20" y2="150"
              stroke="#15803D" stroke-width="1"/>
        <circle cx="20" cy="128" r="4" fill="#FB7185"/>
        <circle cx="20" cy="128" r="1.5" fill="#FCD34D"/>
    </g>
    <g class="flor flor-2">
        <line x1="32" y1="135" x2="32" y2="152"
              stroke="#15803D" stroke-width="1"/>
        <g transform="translate(32,133)">
            <circle cx="-2" cy="-2" r="2" fill="#F472B6"/>
            <circle cx="2"  cy="-2" r="2" fill="#F472B6"/>
            <circle cx="-2" cy="2"  r="2" fill="#F472B6"/>
            <circle cx="2"  cy="2"  r="2" fill="#F472B6"/>
            <circle cx="0"  cy="0"  r="1.4" fill="#FCD34D"/>
        </g>
    </g>
    <g class="flor flor-3">
        <line x1="45" y1="128" x2="45" y2="148"
              stroke="#15803D" stroke-width="1"/>
        <circle cx="45" cy="126" r="4" fill="#A78BFA"/>
        <circle cx="45" cy="126" r="1.5" fill="#FDE68A"/>
    </g>
    <g class="flor flor-4">
        <line x1="58" y1="132" x2="58" y2="150"
              stroke="#15803D" stroke-width="1"/>
        <g transform="translate(58,130)">
            <circle cx="-2" cy="-2" r="2" fill="#F9A8D4"/>
            <circle cx="2"  cy="-2" r="2" fill="#F9A8D4"/>
            <circle cx="-2" cy="2"  r="2" fill="#F9A8D4"/>
            <circle cx="2"  cy="2"  r="2" fill="#F9A8D4"/>
            <circle cx="0"  cy="0"  r="1.4" fill="#FCD34D"/>
        </g>
    </g>
    <g class="flor flor-5">
        <line x1="72" y1="130" x2="72" y2="152"
              stroke="#15803D" stroke-width="1"/>
        <circle cx="72" cy="128" r="4" fill="#38BDF8"/>
        <circle cx="72" cy="128" r="1.5" fill="#FDE68A"/>
    </g>

    <!-- Pastitos -->
    <g class="pasto" stroke="#15803D" stroke-width="0.6" stroke-linecap="round">
        <path d="M12,148 L11,143"/>
        <path d="M26,148 L27,144"/>
        <path d="M40,146 L39,142"/>
        <path d="M52,148 L53,144"/>
        <path d="M66,148 L65,144"/>
        <path d="M78,148 L79,144"/>
    </g>

    <!-- Mariposa -->
    <g class="mariposa">
        <g transform="translate(28, 95)">
            <!-- Ala izquierda -->
            <path class="alas-mariposa izq"
                  d="M0,0 C-4,-4 -6,-8 -4,-10 C-2,-11 1,-6 0,0 Z"
                  fill="#FBBF24"/>
            <!-- Ala derecha -->
            <path class="alas-mariposa der"
                  d="M0,0 C4,-4 6,-8 4,-10 C2,-11 -1,-6 0,0 Z"
                  fill="#FBBF24"/>
            <!-- Cuerpo -->
            <ellipse cx="0" cy="0" rx="0.6" ry="2" fill="#1F2937"/>
            <!-- Antenas -->
            <path d="M0,-2 L-1.5,-3.5 M0,-2 L1.5,-3.5"
                  stroke="#1F2937" stroke-width="0.3" fill="none"/>
        </g>
    </g>
</svg>
</body>
</html>
