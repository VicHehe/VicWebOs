<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Escarabajo</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #F0FDF4 0%, #DCFCE7 60%, #BBF7D0 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        /* Cuerpo flotante */
        .cuerpo {
            transform-box: view-box;
            transform-origin: 45px 95px;
            animation: flotar 3.5s ease-in-out infinite;
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-3px); }
        }

        /* Antenas */
        .antena-izq {
            transform-box: view-box;
            transform-origin: 38px 68px;
            animation: antenaIzq 2s ease-in-out infinite;
        }
        .antena-der {
            transform-box: view-box;
            transform-origin: 52px 68px;
            animation: antenaDer 2.2s ease-in-out infinite;
        }
        @keyframes antenaIzq {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(-8deg); }
        }
        @keyframes antenaDer {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(8deg); }
        }

        /* Patas */
        .pata {
            transform-box: view-box;
            animation: pata 1.2s ease-in-out infinite;
        }
        .pata-1 { animation-delay: 0s; }
        .pata-2 { animation-delay: 0.3s; }
        .pata-3 { animation-delay: 0.6s; }
        @keyframes pata {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.6; }
        }

        /* Brillo metálico pulsante */
        .brillo {
            animation: brillo 2.5s ease-in-out infinite;
        }
        @keyframes brillo {
            0%, 100% { opacity: 0.3; }
            50%      { opacity: 0.9; }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="eb-shine" cx="0.35" cy="0.3" r="0.7">
            <stop offset="0"   stop-color="#86EFAC"/>
            <stop offset="0.4" stop-color="#16A34A"/>
            <stop offset="1"   stop-color="#064E3B"/>
        </radialGradient>
        <radialGradient id="eb-head" cx="0.5" cy="0.4" r="0.6">
            <stop offset="0" stop-color="#22C55E"/>
            <stop offset="1" stop-color="#065F46"/>
        </radialGradient>
        <linearGradient id="eb-leg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#064E3B"/>
            <stop offset="1" stop-color="#022C22"/>
        </linearGradient>
    </defs>

    <!-- Sombra en el piso -->
    <ellipse cx="45" cy="132" rx="22" ry="3" fill="#065F46" opacity="0.18"/>

    <!-- Grupo flotante -->
    <g class="cuerpo">

        <!-- Patas (detrás) -->
        <g stroke="url(#eb-leg)" stroke-width="1.4" stroke-linecap="round" fill="none">
            <path class="pata pata-1" d="M32,90 L24,86 L20,92"/>
            <path class="pata pata-1" d="M32,96 L22,96 L18,102"/>
            <path class="pata pata-1" d="M32,102 L24,106 L20,110"/>
            <path class="pata pata-2" d="M58,90 L66,86 L70,92"/>
            <path class="pata pata-2" d="M58,96 L68,96 L72,102"/>
            <path class="pata pata-2" d="M58,102 L66,106 L70,110"/>
        </g>

        <!-- Antenas -->
        <g class="antena-izq" fill="none" stroke="#065F46" stroke-width="1.1" stroke-linecap="round">
            <path d="M38,68 C34,60 30,54 26,50"/>
            <circle cx="26" cy="50" r="1.6" fill="#22C55E"/>
        </g>
        <g class="antena-der" fill="none" stroke="#065F46" stroke-width="1.1" stroke-linecap="round">
            <path d="M52,68 C56,60 60,54 64,50"/>
            <circle cx="64" cy="50" r="1.6" fill="#22C55E"/>
        </g>

        <!-- Abdomen (parte de abajo) -->
        <ellipse cx="45" cy="110" rx="13" ry="15" fill="url(#eb-shine)"/>

        <!-- Élitros (alas duras que cubren) -->
        <path d="M32,88 C30,98 32,112 36,120 C40,124 44,124 45,124
                 C46,124 50,124 54,120 C58,112 60,98 58,88
                 C54,82 46,82 45,82 C44,82 36,82 32,88 Z"
              fill="url(#eb-shine)"/>
        <!-- Línea central que separa los élitros -->
        <line x1="45" y1="84" x2="45" y2="122"
              stroke="#022C22" stroke-width="0.8" opacity="0.6"/>

        <!-- Manchas del caparazón -->
        <circle cx="39" cy="100" r="3" fill="#022C22" opacity="0.35"/>
        <circle cx="51" cy="100" r="3" fill="#022C22" opacity="0.35"/>
        <circle cx="42" cy="112" r="2" fill="#022C22" opacity="0.25"/>
        <circle cx="48" cy="112" r="2" fill="#022C22" opacity="0.25"/>

        <!-- Tórax / cabeza -->
        <ellipse cx="45" cy="76" rx="10" ry="9" fill="url(#eb-head)"/>
        <!-- Ojos -->
        <circle cx="40" cy="74" r="1.8" fill="#022C22"/>
        <circle cx="50" cy="74" r="1.8" fill="#022C22"/>
        <circle cx="40" cy="73.5" r="0.6" fill="#86EFAC"/>
        <circle cx="50" cy="73.5" r="0.6" fill="#86EFAC"/>
        <!-- Mandíbulas -->
        <path d="M42,82 L41,86 M48,82 L49,86"
              stroke="#022C22" stroke-width="0.8" stroke-linecap="round"/>

        <!-- Brillo metálico (reflejo) -->
        <ellipse class="brillo" cx="40" cy="88" rx="4" ry="2" fill="white" opacity="0.5"
                 transform="rotate(-20 40 88)"/>
        <ellipse class="brillo" cx="52" cy="92" rx="2.5" ry="1.2" fill="white" opacity="0.4"
                 transform="rotate(15 52 92)" style="animation-delay:0.6s"/>
    </g>
</svg>
</body>
</html>
