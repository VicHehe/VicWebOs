<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Espirales</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #1A0A2E 0%, #0A0014 60%, #000000 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        /* Capas rotando en direcciones alternas */
        .spin {
            transform-box: view-box;
            transform-origin: 45px 80px;
        }
        .spin-a { animation: rotar  20s linear infinite; }
        .spin-b { animation: rotarRev 30s linear infinite; }
        .spin-c { animation: rotar  14s linear infinite; }

        @keyframes rotar    { to { transform: rotate(360deg); } }
        @keyframes rotarRev { to { transform: rotate(-360deg); } }

        /* El núcleo late */
        .nucleo {
            transform-box: view-box;
            transform-origin: 45px 80px;
            animation: latir 3s ease-in-out infinite;
        }
        @keyframes latir {
            0%, 100% { opacity: 0.85; transform: scale(1); }
            50%      { opacity: 1;    transform: scale(1.15); }
        }

        /* Estrellas de fondo */
        .estrella {
            animation: titilar 3s ease-in-out infinite;
        }
        .estrella:nth-child(odd) { animation-duration: 4s; }
        @keyframes titilar {
            0%, 100% { opacity: 0.2; }
            50%      { opacity: 0.9; }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="es-halo" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#A855F7" stop-opacity="0.35"/>
            <stop offset="0.5" stop-color="#7C3AED" stop-opacity="0.12"/>
            <stop offset="1" stop-color="#4C1D95" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="es-core" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="0.3" stop-color="#E9D5FF"/>
            <stop offset="1" stop-color="#A855F7"/>
        </radialGradient>
    </defs>

    <!-- Estrellas fijas -->
    <g fill="#C4B5FD">
        <circle class="estrella" cx="12" cy="20" r="0.6"/>
        <circle class="estrella" cx="78" cy="14" r="0.7"/>
        <circle class="estrella" cx="18" cy="145" r="0.5"/>
        <circle class="estrella" cx="76" cy="150" r="0.6"/>
        <circle class="estrella" cx="8"  cy="80" r="0.5"/>
        <circle class="estrella" cx="82" cy="80" r="0.6"/>
        <circle class="estrella" cx="30" cy="12" r="0.5"/>
        <circle class="estrella" cx="60" cy="150" r="0.5"/>
    </g>

    <!-- Halo de fondo -->
    <ellipse cx="45" cy="80" rx="55" ry="55" fill="url(#es-halo)"/>

    <!-- ESPIRAL A — brazos largos que van hacia afuera (sentido horario) -->
    <g class="spin spin-a">
        <!-- Brazo 1: espiral limpia con curvas suaves -->
        <path d="M45,80
                 Q50,80 50,75
                 Q50,68 42,68
                 Q30,68 30,82
                 Q30,98 46,98
                 Q64,98 64,80
                 Q64,60 45,60
                 Q24,60 24,82"
              fill="none" stroke="#C084FC" stroke-width="1.2"
              stroke-linecap="round" opacity="0.9"/>
        <!-- Brazo 2: reflejado (180°) -->
        <path d="M45,80
                 Q40,80 40,85
                 Q40,92 48,92
                 Q60,92 60,78
                 Q60,62 44,62
                 Q26,62 26,80
                 Q26,100 45,100
                 Q66,100 66,78"
              fill="none" stroke="#C084FC" stroke-width="1.2"
              stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- ESPIRAL B — brazos medianos (sentido antihorario) -->
    <g class="spin spin-b">
        <path d="M45,80
                 Q48,80 48,77
                 Q48,72 42,72
                 Q34,72 34,80
                 Q34,90 45,90
                 Q57,90 57,80
                 Q57,68 45,68
                 Q32,68 32,80"
              fill="none" stroke="#A855F7" stroke-width="1.4"
              stroke-linecap="round" opacity="0.95"/>
        <path d="M45,80
                 Q42,80 42,83
                 Q42,88 48,88
                 Q56,88 56,80
                 Q56,70 45,70
                 Q33,70 33,80
                 Q33,92 45,92
                 Q58,92 58,80"
              fill="none" stroke="#A855F7" stroke-width="1.4"
              stroke-linecap="round" opacity="0.95"/>
    </g>

    <!-- ESPIRAL C — brazos cortos internos (sentido horario, más rápida) -->
    <g class="spin spin-c">
        <path d="M45,80
                 Q47,80 47,78
                 Q47,75 44,75
                 Q40,75 40,80
                 Q40,86 45,86
                 Q51,86 51,80
                 Q51,73 45,73"
              fill="none" stroke="#E9D5FF" stroke-width="1.2"
              stroke-linecap="round"/>
        <path d="M45,80
                 Q43,80 43,82
                 Q43,85 46,85
                 Q50,85 50,80
                 Q50,74 45,74
                 Q39,74 39,80
                 Q39,87 45,87"
              fill="none" stroke="#E9D5FF" stroke-width="1.2"
              stroke-linecap="round"/>
    </g>

    <!-- Núcleo brillante -->
    <g class="nucleo">
        <circle cx="45" cy="80" r="5" fill="url(#es-core)"/>
        <circle cx="45" cy="80" r="2.5" fill="white"/>
    </g>
</svg>
</body>
</html>
