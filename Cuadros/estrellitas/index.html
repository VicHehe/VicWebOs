<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estrellitas</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #0A0A20 0%, #1E1B4B 60%, #312E81 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        /* Luna respirando */
        .luna {
            transform-box: view-box;
            transform-origin: 68px 40px;
            animation: lunaLatir 5s ease-in-out infinite;
        }
        @keyframes lunaLatir {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50%      { opacity: 1;    transform: scale(1.06); }
        }

        /* Grupos de estrellas titilando */
        .twinkle-1 { animation: titilar 2.5s ease-in-out infinite; }
        .twinkle-2 { animation: titilar 3.2s ease-in-out infinite; animation-delay: 0.8s; }
        .twinkle-3 { animation: titilar 2.8s ease-in-out infinite; animation-delay: 1.5s; }
        @keyframes titilar {
            0%, 100% { opacity: 0.35; }
            50%      { opacity: 1; }
        }

        /* Estrella fugaz que cruza cada 8 segundos */
        .fugaz {
            animation: cruzar 8s ease-in infinite;
            transform-origin: 0 0;
            opacity: 0;
        }
        @keyframes cruzar {
            0%, 75% { opacity: 0; transform: translate(0, 0); }
            78%     { opacity: 1; transform: translate(0, 0); }
            88%     { opacity: 1; transform: translate(60px, 40px); }
            92%     { opacity: 0; transform: translate(75px, 50px); }
            100%    { opacity: 0; transform: translate(75px, 50px); }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="es-luna" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FFFBEB"/>
            <stop offset="0.7" stop-color="#FEF3C7"/>
            <stop offset="1" stop-color="#FCD34D"/>
        </radialGradient>
        <radialGradient id="es-halo" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FEF3C7" stop-opacity="0.5"/>
            <stop offset="1" stop-color="#FEF3C7" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Halo de la luna -->
    <circle cx="68" cy="40" r="22" fill="url(#es-halo)"/>

    <!-- Luna -->
    <g class="luna">
        <circle cx="68" cy="40" r="10" fill="url(#es-luna)"/>
        <!-- Cráteres -->
        <circle cx="65" cy="37" r="1.8" fill="#D97706" opacity="0.35"/>
        <circle cx="71" cy="43" r="1.3" fill="#D97706" opacity="0.3"/>
        <circle cx="70" cy="36" r="1" fill="#D97706" opacity="0.25"/>
    </g>

    <!-- Estrellas grupo 1 (5 estrellas) -->
    <g class="twinkle-1" fill="#FEF3C7">
        <circle cx="15" cy="20" r="0.9"/>
        <circle cx="32" cy="14" r="0.7"/>
        <circle cx="52" cy="25" r="1"/>
        <circle cx="78" cy="18" r="0.8"/>
        <circle cx="12" cy="55" r="0.7"/>
    </g>

    <!-- Estrellas grupo 2 (5 estrellas) -->
    <g class="twinkle-2" fill="#FEF3C7">
        <circle cx="24" cy="42" r="0.8"/>
        <circle cx="44" cy="50" r="1.1"/>
        <circle cx="62" cy="60" r="0.7"/>
        <circle cx="80" cy="70" r="0.9"/>
        <circle cx="20" cy="75" r="0.7"/>
    </g>

    <!-- Estrellas grupo 3 (5 más pequeñas) -->
    <g class="twinkle-3" fill="#E9D5FF">
        <circle cx="8" cy="38" r="0.6"/>
        <circle cx="38" cy="72" r="0.7"/>
        <circle cx="58" cy="45" r="0.6"/>
        <circle cx="75" cy="52" r="0.6"/>
        <circle cx="50" cy="88" r="0.7"/>
    </g>

    <!-- Estrella fugaz -->
    <g class="fugaz" transform="translate(10, 30)">
        <ellipse cx="0" cy="0" rx="4" ry="0.8" fill="white" opacity="0.9"
                 transform="rotate(-30)"/>
        <circle cx="0" cy="0" r="1.2" fill="white"/>
        <circle cx="0" cy="0" r="2" fill="white" opacity="0.4"/>
    </g>

    <!-- Silueta de montañas abajo -->
    <path d="M0,130 L18,108 L32,118 L48,100 L64,116 L78,104 L90,120 L90,160 L0,160 Z"
          fill="#050510"/>
</svg>
</body>
</html>
