<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fresitas</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #FFF5F8 0%, #FCE7F3 55%, #FBCFE8 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        .fresa {
            transform-box: view-box;
            transform-origin: 45px 100px;
            animation: balanceo 4s ease-in-out infinite;
        }
        @keyframes balanceo {
            0%, 100% { transform: rotate(-2deg); }
            50%      { transform: rotate(2deg); }
        }
        .hojita {
            transform-box: view-box;
            transform-origin: 45px 62px;
            animation: hoja 3.5s ease-in-out infinite;
        }
        @keyframes hoja {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(-4deg); }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="fr-body" cx="0.4" cy="0.35" r="0.75">
            <stop offset="0" stop-color="#FB7185"/>
            <stop offset="0.6" stop-color="#E11D48"/>
            <stop offset="1" stop-color="#9F1239"/>
        </radialGradient>
    </defs>

    <!-- Sombra elíptica en el piso -->
    <ellipse cx="45" cy="130" rx="24" ry="3" fill="#9F1239" opacity="0.15"/>

    <g class="fresa">
        <!-- Cuerpo ANCHO Y REDONDEADO (no estirado) -->
        <path d="M45,128
                 C25,122 15,100 18,80
                 C21,66 32,58 45,58
                 C58,58 69,66 72,80
                 C75,100 65,122 45,128 Z"
              fill="url(#fr-body)"/>

        <!-- Brillo superior izquierdo -->
        <ellipse cx="34" cy="76" rx="5" ry="4" fill="white" opacity="0.3"
                 transform="rotate(-25 34 76)"/>
        <ellipse cx="32" cy="86" rx="2.5" ry="3.5" fill="white" opacity="0.2"
                 transform="rotate(-15 32 86)"/>

        <!-- Semillitas amarillas -->
        <g fill="#FCD34D" opacity="0.9">
            <ellipse cx="38" cy="76" rx="1" ry="0.7"/>
            <ellipse cx="52" cy="74" rx="1" ry="0.7"/>
            <ellipse cx="58" cy="84" rx="1" ry="0.7"/>
            <ellipse cx="28" cy="86" rx="1" ry="0.7"/>
            <ellipse cx="45" cy="86" rx="1" ry="0.7"/>
            <ellipse cx="62" cy="94" rx="1" ry="0.7"/>
            <ellipse cx="24" cy="98" rx="1" ry="0.7"/>
            <ellipse cx="36" cy="96" rx="1" ry="0.7"/>
            <ellipse cx="54" cy="98" rx="1" ry="0.7"/>
            <ellipse cx="45" cy="104" rx="1" ry="0.7"/>
            <ellipse cx="30" cy="108" rx="1" ry="0.7"/>
            <ellipse cx="60" cy="108" rx="1" ry="0.7"/>
            <ellipse cx="38" cy="116" rx="1" ry="0.7"/>
            <ellipse cx="52" cy="116" rx="1" ry="0.7"/>
            <ellipse cx="45" cy="122" rx="1" ry="0.7"/>
        </g>

        <!-- Hojitas en la corona -->
        <g class="hojita">
            <path d="M45,60 C38,52 28,50 24,54 C30,60 40,62 45,60 Z"
                  fill="#16A34A"/>
            <path d="M45,60 C52,52 62,50 66,54 C60,60 50,62 45,60 Z"
                  fill="#15803D"/>
            <path d="M45,60 C42,48 42,40 46,36 C50,42 48,54 45,60 Z"
                  fill="#22C55E"/>
            <path d="M45,60 C48,50 56,44 60,44 C58,52 50,58 45,60 Z"
                  fill="#16A34A"/>
            <path d="M45,60 C42,50 34,44 30,44 C32,52 40,58 45,60 Z"
                  fill="#15803D"/>
            <path d="M45,58 L45,48" stroke="#166534" stroke-width="1.2"
                  stroke-linecap="round"/>
        </g>
    </g>
</svg>
</body>
</html>
