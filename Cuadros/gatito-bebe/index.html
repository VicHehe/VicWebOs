<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gatito Bebé</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 40%, #FFF5F8 0%, #FCE7F3 55%, #FBCFE8 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        /* ============ ANIMACIONES ============ */

        /* 1. Todo el gatito flota */
        .gato {
            transform-box: view-box;
            transform-origin: 45px 100px;
            animation: flotar 4s ease-in-out infinite;
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-2.5px); }
        }

        /* 2. Orejas moviéndose independientes */
        .oreja-izq {
            transform-box: view-box;
            transform-origin: 33px 72px;
            animation: orejaIzq 3s ease-in-out infinite;
        }
        .oreja-der {
            transform-box: view-box;
            transform-origin: 57px 72px;
            animation: orejaDer 3.3s ease-in-out infinite;
        }
        @keyframes orejaIzq {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(-6deg); }
        }
        @keyframes orejaDer {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(6deg); }
        }

        /* 3. Ojos que parpadean cada 5s */
        .parpado {
            transform-box: view-box;
            animation: parpadeo 5s ease-in-out infinite;
        }
        @keyframes parpadeo {
            0%, 45%, 55%, 100% { transform: scaleY(0); }
            50%                { transform: scaleY(1); }
        }

        /* 4. Cola oscilando */
        .cola {
            transform-box: view-box;
            transform-origin: 62px 120px;
            animation: cola 2.5s ease-in-out infinite;
        }
        @keyframes cola {
            0%, 100% { transform: rotate(-4deg); }
            50%      { transform: rotate(8deg); }
        }

        /* 5. Bigotes temblorosos */
        .bigotes {
            animation: bigoteTic 3s ease-in-out infinite;
        }
        @keyframes bigoteTic {
            0%, 100% { opacity: 0.65; }
            50%      { opacity: 1; }
        }

        /* 6. Mariposa que revolotea */
        .mariposa {
            animation: mariposaVuelo 6s ease-in-out infinite;
        }
        @keyframes mariposaVuelo {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(3px, -5px); }
            50%  { transform: translate(-2px, -8px); }
            75%  { transform: translate(-4px, -3px); }
            100% { transform: translate(0, 0); }
        }
        .alas-mariposa {
            transform-box: fill-box;
            animation: aletear 0.25s ease-in-out infinite;
        }
        .alas-mariposa.izq { transform-origin: right center; }
        .alas-mariposa.der { transform-origin: left center; }
        @keyframes aletear {
            0%, 100% { transform: scaleX(1); }
            50%      { transform: scaleX(0.3); }
        }

        /* 7. Colita de la mariposa oscilando */
        .mariposa-cola {
            animation: mariposaCola 1.5s ease-in-out infinite;
        }
        @keyframes mariposaCola {
            0%, 100% { transform: rotate(-3deg); }
            50%      { transform: rotate(3deg); }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="gt-body" cx="0.4" cy="0.35" r="0.7">
            <stop offset="0" stop-color="#FFEDD5"/>
            <stop offset="1" stop-color="#FED7AA"/>
        </radialGradient>
        <radialGradient id="gt-head" cx="0.4" cy="0.3" r="0.8">
            <stop offset="0" stop-color="#FFF7ED"/>
            <stop offset="1" stop-color="#FED7AA"/>
        </radialGradient>
        <radialGradient id="gt-eye" cx="0.35" cy="0.3" r="0.7">
            <stop offset="0" stop-color="#374151"/>
            <stop offset="1" stop-color="#111827"/>
        </radialGradient>
        <radialGradient id="gt-nose" cx="0.5" cy="0.3" r="0.7">
            <stop offset="0" stop-color="#FDA4AF"/>
            <stop offset="1" stop-color="#E11D48"/>
        </radialGradient>
    </defs>

    <!-- Sombra en el piso -->
    <ellipse cx="45" cy="142" rx="22" ry="2.5" fill="#9A3412" opacity="0.18"/>

    <!-- Mariposa de fondo (arriba a la derecha) -->
    <g class="mariposa" transform="translate(72, 55)">
        <!-- Alas traseras -->
        <path class="alas-mariposa izq"
              d="M0,1 C-3,3 -5,6 -3,8 C-1,9 1,6 0,1 Z" fill="#FBBF24" opacity="0.9"/>
        <path class="alas-mariposa der"
              d="M0,1 C3,3 5,6 3,8 C1,9 -1,6 0,1 Z" fill="#FBBF24" opacity="0.9"/>
        <!-- Alas delanteras -->
        <path class="alas-mariposa izq"
              d="M0,0 C-4,-3 -6,-7 -3,-9 C0,-10 1,-5 0,0 Z" fill="#F59E0B"/>
        <path class="alas-mariposa der"
              d="M0,0 C4,-3 6,-7 3,-9 C0,-10 -1,-5 0,0 Z" fill="#F59E0B"/>
        <!-- Puntos en las alas -->
        <circle cx="-2" cy="-6" r="0.7" fill="#78350F" opacity="0.6"/>
        <circle cx="2" cy="-6" r="0.7" fill="#78350F" opacity="0.6"/>
        <!-- Cuerpo -->
        <ellipse cx="0" cy="0" rx="0.7" ry="3" fill="#1F2937"/>
        <!-- Cola ondulada -->
        <path class="mariposa-cola"
              d="M0,3 C0.5,4.5 -0.5,5 0,6" fill="none"
              stroke="#1F2937" stroke-width="0.3"/>
        <!-- Antenas -->
        <path d="M0,-3 L-1.5,-5 M0,-3 L1.5,-5"
              stroke="#1F2937" stroke-width="0.3" fill="none"/>
    </g>

    <g class="gato">

        <!-- ============ COLA ============ -->
        <g class="cola">
            <!-- Base gruesa -->
            <path d="M62,120 C70,122 78,118 80,110 C82,102 76,98 71,101"
                  fill="none" stroke="#FED7AA" stroke-width="5" stroke-linecap="round"/>
            <!-- Sombra interna -->
            <path d="M62,120 C70,122 78,118 80,110 C82,102 76,98 71,101"
                  fill="none" stroke="#FB923C" stroke-width="2" stroke-linecap="round"
                  opacity="0.35"/>
            <!-- Punta clara -->
            <circle cx="71" cy="101" r="3" fill="#FFF7ED"/>
            <!-- Rayas de la cola -->
            <path d="M66,120 L66,117 M70,120 L71,117 M75,117 L76,114"
                  stroke="#FB923C" stroke-width="0.7" opacity="0.5"
                  stroke-linecap="round"/>
        </g>

        <!-- ============ PATAS TRASERAS ============ -->
        <ellipse cx="32" cy="132" rx="7" ry="4" fill="#FED7AA"/>
        <ellipse cx="58" cy="132" rx="7" ry="4" fill="#FED7AA"/>
        <!-- Almohadillas traseras -->
        <circle cx="30" cy="133" r="1" fill="#FB923C" opacity="0.55"/>
        <circle cx="34" cy="133" r="1" fill="#FB923C" opacity="0.55"/>
        <circle cx="56" cy="133" r="1" fill="#FB923C" opacity="0.55"/>
        <circle cx="60" cy="133" r="1" fill="#FB923C" opacity="0.55"/>

        <!-- ============ CUERPO ============ -->
        <!-- Cuerpo redondo -->
        <ellipse cx="45" cy="115" rx="19" ry="20" fill="url(#gt-body)"/>
        <!-- Panza clara -->
        <ellipse cx="45" cy="118" rx="11" ry="12" fill="#FFF7ED" opacity="0.7"/>
        <!-- Manchas suaves del pelaje -->
        <ellipse cx="35" cy="110" rx="4" ry="3" fill="#FED7AA" opacity="0.6"/>
        <ellipse cx="55" cy="113" rx="3.5" ry="2.5" fill="#FED7AA" opacity="0.6"/>

        <!-- ============ PATAS DELANTERAS ============ -->
        <ellipse cx="38" cy="130" rx="5" ry="4" fill="#FFEDD5"/>
        <ellipse cx="52" cy="130" rx="5" ry="4" fill="#FFEDD5"/>
        <!-- Almohadillas -->
        <circle cx="36.5" cy="131" r="0.7" fill="#FB7185" opacity="0.6"/>
        <circle cx="38.5" cy="131" r="0.7" fill="#FB7185" opacity="0.6"/>
        <circle cx="39.5" cy="130" r="0.6" fill="#FB7185" opacity="0.6"/>
        <circle cx="50.5" cy="131" r="0.7" fill="#FB7185" opacity="0.6"/>
        <circle cx="52.5" cy="131" r="0.7" fill="#FB7185" opacity="0.6"/>
        <circle cx="51.5" cy="130" r="0.6" fill="#FB7185" opacity="0.6"/>

        <!-- ============ OREJAS ============ -->
        <g class="oreja-izq">
            <!-- Oreja externa -->
            <path d="M33,80 L28,62 L43,71 Z" fill="#FED7AA"/>
            <!-- Oreja interna -->
            <path d="M33,77 L30,66 L40,72 Z" fill="#FBCFE8"/>
            <!-- Pelitos -->
            <path d="M32,73 L31,70 M35,74 L34,71 M38,75 L37,72"
                  stroke="#FB7185" stroke-width="0.3" opacity="0.6"
                  stroke-linecap="round"/>
        </g>
        <g class="oreja-der">
            <path d="M57,80 L62,62 L47,71 Z" fill="#FED7AA"/>
            <path d="M57,77 L60,66 L50,72 Z" fill="#FBCFE8"/>
            <path d="M58,73 L59,70 M55,74 L56,71 M52,75 L53,72"
                  stroke="#FB7185" stroke-width="0.3" opacity="0.6"
                  stroke-linecap="round"/>
        </g>

        <!-- ============ CABEZA ============ -->
        <ellipse cx="45" cy="90" rx="19" ry="18" fill="url(#gt-head)"/>
        <!-- Rayas de la frente -->
        <path d="M41,77 L42,82 M45,75 L45,81 M49,77 L48,82"
              stroke="#FB923C" stroke-width="0.6" opacity="0.55"
              stroke-linecap="round"/>

        <!-- Mejillas rosadas -->
        <ellipse cx="33" cy="95" rx="4" ry="2.4" fill="#FBCFE8" opacity="0.8"/>
        <ellipse cx="57" cy="95" rx="4" ry="2.4" fill="#FBCFE8" opacity="0.8"/>

        <!-- ============ OJOS GRANDES ============ -->
        <ellipse cx="38" cy="88" rx="4" ry="4.5" fill="url(#gt-eye)"/>
        <ellipse cx="52" cy="88" rx="4" ry="4.5" fill="url(#gt-eye)"/>
        <!-- Brillo principal (grande) -->
        <circle cx="36.8" cy="86.2" r="1.4" fill="white"/>
        <circle cx="50.8" cy="86.2" r="1.4" fill="white"/>
        <!-- Brillo secundario -->
        <circle cx="39.5" cy="89.5" r="0.7" fill="white" opacity="0.7"/>
        <circle cx="53.5" cy="89.5" r="0.7" fill="white" opacity="0.7"/>
        <!-- Puntito de color en el ojo -->
        <circle cx="37.5" cy="84.5" r="0.4" fill="#FBBF24" opacity="0.8"/>
        <circle cx="51.5" cy="84.5" r="0.4" fill="#FBBF24" opacity="0.8"/>
        <!-- Párpados que bajan -->
        <rect class="parpado" x="34" y="83" width="8" height="9" fill="#FED7AA"/>
        <rect class="parpado" x="48" y="83" width="8" height="9" fill="#FED7AA"/>

        <!-- ============ NARIZ Y BOCA ============ -->
        <ellipse cx="45" cy="96" rx="1.8" ry="1.3" fill="url(#gt-nose)"/>
        <ellipse cx="44.5" cy="95.7" rx="0.5" ry="0.3" fill="white" opacity="0.6"/>
        <!-- Línea al centro -->
        <line x1="45" y1="97.3" x2="45" y2="99.5"
              stroke="#BE123C" stroke-width="0.5" stroke-linecap="round"/>
        <!-- Boquita curva -->
        <path d="M42,99.5 Q45,101.5 48,99.5" fill="none"
              stroke="#BE123C" stroke-width="0.5" stroke-linecap="round"/>

        <!-- ============ BIGOTES ============ -->
        <g class="bigotes" stroke="#78350F" stroke-width="0.45"
           stroke-linecap="round" opacity="0.85">
            <!-- Izquierda -->
            <line x1="30" y1="94" x2="22" y2="92"/>
            <line x1="30" y1="96" x2="21" y2="96"/>
            <line x1="30" y1="98" x2="22" y2="100"/>
            <!-- Derecha -->
            <line x1="60" y1="94" x2="68" y2="92"/>
            <line x1="60" y1="96" x2="69" y2="96"/>
            <line x1="60" y1="98" x2="68" y2="100"/>
        </g>
    </g>
</svg>
</body>
</html>
