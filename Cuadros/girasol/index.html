<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girasol</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #BAE6FD 0%, #E0F2FE 55%, #D9F99D 100%);
        }
        svg { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="gi-centro" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#92400E"/>
            <stop offset="1" stop-color="#451A03"/>
        </radialGradient>
    </defs>

    <!-- Sol de fondo -->
    <circle cx="76" cy="18" r="7" fill="#FDE68A"/>

    <!-- Colina -->
    <path d="M0,128 Q30,118 60,126 T90,124 L90,160 L0,160 Z" fill="#86EFAC" opacity="0.7"/>

    <!-- Planta completa: se mece desde la base (45,150) -->
    <g>
        <animateTransform attributeName="transform" type="rotate"
            values="-2 45 150;2 45 150;-2 45 150" dur="4s" repeatCount="indefinite"/>

        <!-- Tallo -->
        <line x1="45" y1="70" x2="45" y2="150" stroke="#16A34A" stroke-width="2.2" stroke-linecap="round"/>

        <!-- Hoja izquierda -->
        <g>
            <animateTransform attributeName="transform" type="rotate"
                values="0 45 124;-5 45 124;0 45 124" dur="3s" repeatCount="indefinite"/>
            <path d="M45,124 C34,120 26,114 24,104 C34,106 42,112 45,124 Z" fill="#22C55E"/>
        </g>

        <!-- Hoja derecha -->
        <g>
            <animateTransform attributeName="transform" type="rotate"
                values="0 45 110;5 45 110;0 45 110" dur="3.4s" repeatCount="indefinite"/>
            <path d="M45,110 C56,106 64,100 66,90 C56,94 48,100 45,110 Z" fill="#16A34A"/>
        </g>

        <!-- Cabeza: pétalos (giran lento) + centro -->
        <g>
            <!-- Pétalos -->
            <g>
                <animateTransform attributeName="transform" type="rotate"
                    values="0 45 66;360 45 66" dur="60s" repeatCount="indefinite"/>
                <ellipse cx="45" cy="50" rx="4.5" ry="11" fill="#FACC15" transform="rotate(0 45 66)"/>
                <ellipse cx="45" cy="50" rx="4.5" ry="11" fill="#FACC15" transform="rotate(30 45 66)"/>
                <ellipse cx="45" cy="50" rx="4.5" ry="11" fill="#FACC15" transform="rotate(60 45 66)"/>
                <ellipse cx="45" cy="50" rx="4.5" ry="11" fill="#FACC15" transform="rotate(90 45 66)"/>
                <ellipse cx="45" cy="50" rx="4.5" ry="11" fill="#FACC15" transform="rotate(120 45 66)"/>
                <ellipse cx="45" cy="50" rx="4.5" ry="11" fill="#FACC15" transform="rotate(150 45 66)"/>
                <ellipse cx="45" cy="50" rx="4.5" ry="11" fill="#FACC15" transform="rotate(180 45 66)"/>
                <ellipse cx="45" cy="50" rx="4.5" ry="11" fill="#FACC15" transform="rotate(210 45 66)"/>
                <ellipse cx="45" cy="50" rx="4.5" ry="11" fill="#FACC15" transform="rotate(240 45 66)"/>
                <ellipse cx="45" cy="50" rx="4.5" ry="11" fill="#FACC15" transform="rotate(270 45 66)"/>
                <ellipse cx="45" cy="50" rx="4.5" ry="11" fill="#FACC15" transform="rotate(300 45 66)"/>
                <ellipse cx="45" cy="50" rx="4.5" ry="11" fill="#FACC15" transform="rotate(330 45 66)"/>
            </g>

            <!-- Centro -->
            <circle cx="45" cy="66" r="10" fill="url(#gi-centro)"/>
            <circle cx="41" cy="63" r="1" fill="#A16207"/>
            <circle cx="47" cy="62" r="1" fill="#A16207"/>
            <circle cx="44" cy="68" r="1" fill="#A16207"/>
            <circle cx="50" cy="68" r="1" fill="#A16207"/>
            <circle cx="39" cy="67" r="0.9" fill="#A16207"/>
            <!-- Carita -->
            <circle cx="41" cy="65" r="0.9" fill="#FEF3C7"/>
            <circle cx="49" cy="65" r="0.9" fill="#FEF3C7"/>
            <path d="M42,70 Q45,72 48,70" stroke="#FEF3C7" stroke-width="0.6" fill="none" stroke-linecap="round"/>
        </g>
    </g>

    <!-- Tierra -->
    <rect x="0" y="150" width="90" height="10" fill="#854D0E" opacity="0.7"/>
</svg>
</body>
</html>
