<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hormiga</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #FEF3C7 0%, #FDE68A 40%, #D97706 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        /* Cada hormiga camina en loop */
        .hormiga {
            transform-box: view-box;
            animation: caminar linear infinite;
        }
        .hormiga-1 { animation-duration: 14s; }
        .hormiga-2 { animation-duration: 14s; animation-delay: -4.5s; }
        .hormiga-3 { animation-duration: 14s; animation-delay: -9s; }

        @keyframes caminar {
            0%   { transform: translateX(-15px); }
            100% { transform: translateX(115px); }
        }

        /* Cuerpo bobbing al caminar */
        .cuerpo-hormiga {
            transform-box: fill-box;
            animation: bob 0.5s ease-in-out infinite;
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-0.4px); }
        }

        /* Antenas oscilando */
        .antena {
            transform-box: fill-box;
            transform-origin: 50% 100%;
            animation: antenaWiggle 0.9s ease-in-out infinite;
        }
        @keyframes antenaWiggle {
            0%, 100% { transform: rotate(-10deg); }
            50%      { transform: rotate(10deg); }
        }

        /* Patas caminando en 2 grupos alternos */
        .pata-a {
            transform-box: fill-box;
            transform-origin: 50% 0%;
            animation: pataWalk 0.5s ease-in-out infinite;
        }
        .pata-b {
            transform-box: fill-box;
            transform-origin: 50% 0%;
            animation: pataWalk 0.5s ease-in-out infinite;
            animation-delay: -0.25s;
        }
        @keyframes pataWalk {
            0%, 100% { transform: rotate(-18deg); }
            50%      { transform: rotate(18deg); }
        }

        /* Hoja meciéndose */
        .hoja {
            transform-box: view-box;
            transform-origin: 18px 124px;
            animation: hojaMecer 4s ease-in-out infinite;
        }
        @keyframes hojaMecer {
            0%, 100% { transform: rotate(-3deg); }
            50%      { transform: rotate(3deg); }
        }

        /* Miguitas brillando */
        .miguita {
            animation: miguitaBrillo 2.5s ease-in-out infinite;
        }
        .miguita:nth-child(2n) { animation-delay: 0.6s; }
        @keyframes miguitaBrillo {
            0%, 100% { opacity: 0.5; }
            50%      { opacity: 0.9; }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="hm-sol" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FEF3C7" stop-opacity="0.6"/>
            <stop offset="1" stop-color="#FEF3C7" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Sol suave arriba -->
    <circle cx="20" cy="20" r="22" fill="url(#hm-sol)"/>

    <!-- Silueta de montículos de tierra al fondo -->
    <path d="M0,110 Q22,100 45,108 T90,104 L90,160 L0,160 Z"
          fill="#92400E" opacity="0.25"/>

    <!-- Suelo principal (tierra) -->
    <path d="M0,118 Q25,114 45,116 T90,114 L90,160 L0,160 Z"
          fill="#B45309" opacity="0.5"/>
    <path d="M0,128 Q30,124 60,130 T90,126 L90,160 L0,160 Z"
          fill="#78350F" opacity="0.4"/>

    <!-- Granitos de tierra -->
    <g fill="#451A03" opacity="0.5">
        <circle cx="12" cy="135" r="0.7"/>
        <circle cx="28" cy="140" r="0.5"/>
        <circle cx="44" cy="132" r="0.6"/>
        <circle cx="62" cy="138" r="0.5"/>
        <circle cx="78" cy="142" r="0.6"/>
        <circle cx="55" cy="146" r="0.5"/>
        <circle cx="20" cy="148" r="0.6"/>
        <circle cx="72" cy="150" r="0.5"/>
    </g>

    <!-- Hoja que se mece (fondo) -->
    <g class="hoja">
        <ellipse cx="20" cy="126" rx="15" ry="5" fill="#22C55E" opacity="0.75"/>
        <path d="M6,126 Q20,124 34,126"
              stroke="#15803D" stroke-width="0.4" fill="none" opacity="0.6"/>
        <!-- Vena central -->
        <line x1="6" y1="126" x2="34" y2="126"
              stroke="#166534" stroke-width="0.4" opacity="0.5"/>
    </g>

    <!-- Miguitas de pan (objetivo) a la derecha -->
    <g fill="#FCD34D">
        <circle class="miguita" cx="78" cy="112" r="0.9"/>
        <circle class="miguita" cx="80" cy="115" r="0.6"/>
        <circle class="miguita" cx="76" cy="116" r="0.5"/>
    </g>

    <!-- ============================================================
         HORMIGA — reusable, caminando en línea
         ============================================================ -->
    <g class="hormiga hormiga-1" transform="translate(0, 108)">
        <g class="cuerpo-hormiga">
            <!-- Abdomen -->
            <ellipse cx="-1" cy="0" rx="3.5" ry="3" fill="#1F2937"/>
            <ellipse cx="-1.5" cy="-0.8" rx="1.4" ry="0.9" fill="#4B5563" opacity="0.55"/>
            <!-- Thorax -->
            <ellipse cx="3.5" cy="0" rx="1.8" ry="1.9" fill="#1F2937"/>
            <!-- Cabeza -->
            <circle cx="6.8" cy="0" r="2.2" fill="#1F2937"/>
            <!-- Ojo -->
            <circle cx="7.4" cy="-0.6" r="0.5" fill="#FCD34D"/>
            <!-- Antenas -->
            <g stroke="#1F2937" stroke-width="0.55" fill="none" stroke-linecap="round">
                <path class="antena" d="M6.5,-2 C6,-4.5 4.5,-5.5 4,-7"/>
                <path class="antena" d="M7.5,-2 C8,-4.5 9.5,-5.5 10,-7"/>
            </g>
            <!-- Patas (3 visibles desde el costado) -->
            <g stroke="#1F2937" stroke-width="0.55" fill="none" stroke-linecap="round">
                <path class="pata-a" d="M2,1.5 L1,4 L0.5,5"/>
                <path class="pata-b" d="M3.5,1.5 L3.5,4 L3.5,5"/>
                <path class="pata-a" d="M5,1.5 L6,4 L6.5,5"/>
            </g>
        </g>
    </g>

    <g class="hormiga hormiga-2" transform="translate(0, 108)">
        <g class="cuerpo-hormiga">
            <ellipse cx="-1" cy="0" rx="3.5" ry="3" fill="#1F2937"/>
            <ellipse cx="-1.5" cy="-0.8" rx="1.4" ry="0.9" fill="#4B5563" opacity="0.55"/>
            <ellipse cx="3.5" cy="0" rx="1.8" ry="1.9" fill="#1F2937"/>
            <circle cx="6.8" cy="0" r="2.2" fill="#1F2937"/>
            <circle cx="7.4" cy="-0.6" r="0.5" fill="#FCD34D"/>
            <g stroke="#1F2937" stroke-width="0.55" fill="none" stroke-linecap="round">
                <path class="antena" d="M6.5,-2 C6,-4.5 4.5,-5.5 4,-7"/>
                <path class="antena" d="M7.5,-2 C8,-4.5 9.5,-5.5 10,-7"/>
            </g>
            <g stroke="#1F2937" stroke-width="0.55" fill="none" stroke-linecap="round">
                <path class="pata-a" d="M2,1.5 L1,4 L0.5,5"/>
                <path class="pata-b" d="M3.5,1.5 L3.5,4 L3.5,5"/>
                <path class="pata-a" d="M5,1.5 L6,4 L6.5,5"/>
            </g>
        </g>
    </g>

    <g class="hormiga hormiga-3" transform="translate(0, 108)">
        <g class="cuerpo-hormiga">
            <ellipse cx="-1" cy="0" rx="3.5" ry="3" fill="#1F2937"/>
            <ellipse cx="-1.5" cy="-0.8" rx="1.4" ry="0.9" fill="#4B5563" opacity="0.55"/>
            <ellipse cx="3.5" cy="0" rx="1.8" ry="1.9" fill="#1F2937"/>
            <circle cx="6.8" cy="0" r="2.2" fill="#1F2937"/>
            <circle cx="7.4" cy="-0.6" r="0.5" fill="#FCD34D"/>
            <g stroke="#1F2937" stroke-width="0.55" fill="none" stroke-linecap="round">
                <path class="antena" d="M6.5,-2 C6,-4.5 4.5,-5.5 4,-7"/>
                <path class="antena" d="M7.5,-2 C8,-4.5 9.5,-5.5 10,-7"/>
            </g>
            <g stroke="#1F2937" stroke-width="0.55" fill="none" stroke-linecap="round">
                <path class="pata-a" d="M2,1.5 L1,4 L0.5,5"/>
                <path class="pata-b" d="M3.5,1.5 L3.5,4 L3.5,5"/>
                <path class="pata-a" d="M5,1.5 L6,4 L6.5,5"/>
            </g>
        </g>
    </g>
</svg>
</body>
</html>
