<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Manzanitas</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #F0FDF4 0%, #DCFCE7 55%, #BBF7D0 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        .manzana {
            transform-box: view-box;
            transform-origin: 45px 130px;
            animation: balanceo 4s ease-in-out infinite;
        }
        @keyframes balanceo {
            0%, 100% { transform: rotate(-2deg); }
            50%      { transform: rotate(2deg); }
        }
        .hojita {
            transform-box: view-box;
            transform-origin: 48px 58px;
            animation: hoja 3.5s ease-in-out infinite;
        }
        @keyframes hoja {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(5deg); }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="mn-body" cx="0.35" cy="0.3" r="0.75">
            <stop offset="0" stop-color="#F87171"/>
            <stop offset="0.5" stop-color="#DC2626"/>
            <stop offset="1" stop-color="#7F1D1D"/>
        </radialGradient>
        <linearGradient id="mn-leaf" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22C55E"/>
            <stop offset="1" stop-color="#166534"/>
        </linearGradient>
    </defs>

    <!-- Sombra -->
    <ellipse cx="45" cy="148" rx="22" ry="3" fill="#7F1D1D" opacity="0.15"/>

    <g class="manzana">
        <!-- Cuerpo de la manzana (dos lóbulos) -->
        <path d="M45,68
                 C38,60 28,58 22,66
                 C14,78 16,100 24,118
                 C30,132 40,140 45,140
                 C50,140 60,132 66,118
                 C74,100 76,78 68,66
                 C62,58 52,60 45,68 Z"
              fill="url(#mn-body)"/>

        <!-- Hendidura superior -->
        <path d="M45,68 C43,72 43,74 45,76 C47,74 47,72 45,68 Z"
              fill="#7F1D1D" opacity="0.4"/>

        <!-- Reflejo brillante -->
        <ellipse cx="32" cy="90" rx="6" ry="9" fill="white" opacity="0.28"
                 transform="rotate(-20 32 90)"/>
        <ellipse cx="30" cy="86" rx="2.5" ry="4" fill="white" opacity="0.4"
                 transform="rotate(-20 30 86)"/>

        <!-- Puntitos de textura -->
        <g fill="#7F1D1D" opacity="0.2">
            <circle cx="55" cy="95" r="0.8"/>
            <circle cx="58" cy="110" r="0.8"/>
            <circle cx="35" cy="115" r="0.8"/>
            <circle cx="50" cy="125" r="0.8"/>
            <circle cx="40" cy="105" r="0.7"/>
        </g>

        <!-- Tallito -->
        <path d="M45,64 C45,58 46,54 48,50"
              stroke="#451A03" stroke-width="1.8" fill="none"
              stroke-linecap="round"/>

        <!-- Hojita con vena -->
        <g class="hojita">
            <path d="M48,55 C54,48 62,48 65,54 C60,60 52,60 48,55 Z"
                  fill="url(#mn-leaf)"/>
            <path d="M48,55 C54,54 60,54 65,54"
                  stroke="#166534" stroke-width="0.4" fill="none"
                  opacity="0.7"/>
        </g>
    </g>
</svg>
</body>
</html>
