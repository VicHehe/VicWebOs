<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Manzanitas</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #F0FDF4 0%, #DCFCE7 55%, #BBF7D0 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        .manzana {
            transform-box: view-box;
            transform-origin: 45px 100px;
            animation: balanceo 4s ease-in-out infinite;
        }
        @keyframes balanceo {
            0%, 100% { transform: rotate(-2deg); }
            50%      { transform: rotate(2deg); }
        }
        .hojita {
            transform-box: view-box;
            transform-origin: 50px 56px;
            animation: hoja 3.5s ease-in-out infinite;
        }
        @keyframes hoja {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(6deg); }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="mn-body" cx="0.35" cy="0.3" r="0.75">
            <stop offset="0" stop-color="#F87171"/>
            <stop offset="0.5" stop-color="#DC2626"/>
            <stop offset="1" stop-color="#7F1D1D"/>
        </radialGradient>
        <linearGradient id="mn-leaf" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22C55E"/>
            <stop offset="1" stop-color="#166534"/>
        </linearGradient>
    </defs>

    <ellipse cx="45" cy="132" rx="24" ry="3" fill="#7F1D1D" opacity="0.15"/>

    <g class="manzana">
        <!-- Cuerpo ANCHO Y REDONDO (degradado de dos lóbulos arriba, curvas redondas abajo) -->
        <path d="M45,68
                 C40,60 30,58 24,66
                 C16,78 16,100 22,116
                 C28,128 38,134 45,134
                 C52,134 62,128 68,116
                 C74,100 74,78 66,66
                 C60,58 50,60 45,68 Z"
              fill="url(#mn-body)"/>

        <!-- Hendidura superior -->
        <path d="M45,68 C44,72 44,74 45,76 C46,74 46,72 45,68 Z"
              fill="#7F1D1D" opacity="0.45"/>

        <!-- Reflejo brillante -->
        <ellipse cx="30" cy="88" rx="5" ry="7" fill="white" opacity="0.28"
                 transform="rotate(-20 30 88)"/>
        <ellipse cx="28" cy="84" rx="2" ry="3.5" fill="white" opacity="0.45"
                 transform="rotate(-20 28 84)"/>

        <!-- Puntitos de textura -->
        <g fill="#7F1D1D" opacity="0.22">
            <circle cx="56" cy="92" r="0.8"/>
            <circle cx="58" cy="106" r="0.8"/>
            <circle cx="36" cy="112" r="0.8"/>
            <circle cx="52" cy="120" r="0.8"/>
            <circle cx="40" cy="100" r="0.7"/>
        </g>

        <!-- Tallito -->
        <path d="M45,64 C45,58 46,54 48,50"
              stroke="#451A03" stroke-width="1.8" fill="none"
              stroke-linecap="round"/>

        <!-- Hojita con vena -->
        <g class="hojita">
            <path d="M50,56 C56,48 66,48 70,54 C64,60 54,60 50,56 Z"
                  fill="url(#mn-leaf)"/>
            <path d="M50,56 C57,55 64,55 70,54"
                  stroke="#166534" stroke-width="0.4" fill="none"
                  opacity="0.7"/>
        </g>
    </g>
</svg>
</body>
</html>
