<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My B.O.D</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1E1B4B;
        }
        svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Sol: respiración --- */
        .sol {
            transform-box: view-box;
            transform-origin: 45px 92px;
            animation: solPulso 4s ease-in-out infinite;
        }
        @keyframes solPulso {
            0%, 100% { opacity: 0.92; transform: scale(1); }
            50%      { opacity: 1;    transform: scale(1.06); }
        }

        /* --- Reflejo del sol sobre el agua --- */
        .reflejo {
            animation: reflejoPulso 2.5s ease-in-out infinite;
        }
        @keyframes reflejoPulso {
            0%, 100% { opacity: 0.45; }
            50%      { opacity: 0.9; }
        }

        /* --- Olas (3 capas) --- */
        .ola-3 {
            animation: olaMov3 10s linear infinite;
            will-change: transform;
        }
        .ola-2 {
            animation: olaMov2 7s linear infinite;
            will-change: transform;
        }
        .ola-1 {
            animation: olaMov1 5s linear infinite;
            will-change: transform;
        }
        @keyframes olaMov3 {
            from { transform: translateX(0); }
            to   { transform: translateX(-45px); }
        }
        @keyframes olaMov2 {
            from { transform: translateX(-45px); }
            to   { transform: translateX(0); }
        }
        @keyframes olaMov1 {
            from { transform: translateX(0); }
            to   { transform: translateX(-45px); }
        }

        /* --- Palmera --- */
        .palmera {
            transform-box: view-box;
            transform-origin: 71px 138px;
            animation: palmeraSway 4s ease-in-out infinite;
        }
        @keyframes palmeraSway {
            0%, 100% { transform: rotate(-1.2deg); }
            50%      { transform: rotate(1.2deg); }
        }

        /* --- Nubes --- */
        .nubes {
            animation: nubesDeriva 22s linear infinite;
            will-change: transform;
        }
        @keyframes nubesDeriva {
            from { transform: translateX(0); }
            to   { transform: translateX(-20px); }
        }

        /* --- Estrellas --- */
        .estrella {
            animation: titilar 2.5s ease-in-out infinite;
        }
        .estrella:nth-child(2n) { animation-duration: 3.5s; animation-delay: 0.5s; }
        .estrella:nth-child(3n) { animation-duration: 3s;   animation-delay: 1.2s; }
        @keyframes titilar {
            0%, 100% { opacity: 0.3; }
            50%      { opacity: 1; }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bod-sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"    stop-color="#1E1B4B"/>
            <stop offset="0.28" stop-color="#4C1D95"/>
            <stop offset="0.5"  stop-color="#9D174D"/>
            <stop offset="0.7"  stop-color="#DC2626"/>
            <stop offset="0.85" stop-color="#F97316"/>
            <stop offset="0.95" stop-color="#FBBF24"/>
            <stop offset="1"    stop-color="#FEF3C7"/>
        </linearGradient>
        <radialGradient id="bod-sun" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0"   stop-color="#FFFBEB"/>
            <stop offset="0.35" stop-color="#FCD34D"/>
            <stop offset="1"   stop-color="#F59E0B"/>
        </radialGradient>
        <radialGradient id="bod-halo" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0"   stop-color="#FCD34D" stop-opacity="0.85"/>
            <stop offset="0.4" stop-color="#F97316" stop-opacity="0.35"/>
            <stop offset="1"   stop-color="#DC2626" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bod-sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#7C2D12"/>
            <stop offset="0.25" stop-color="#9A3412"/>
            <stop offset="0.5" stop-color="#1E3A8A"/>
            <stop offset="1"   stop-color="#0C1E4A"/>
        </linearGradient>
        <linearGradient id="bod-reflect" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FEF3C7" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="bod-sand" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#451A03"/>
            <stop offset="1" stop-color="#1C0A02"/>
        </linearGradient>
    </defs>

    <!-- Cielo -->
    <rect width="90" height="105" fill="url(#bod-sky)"/>

    <!-- Estrellas -->
    <g fill="#FFFFFF">
        <circle class="estrella" cx="12" cy="8"  r="0.5"/>
        <circle class="estrella" cx="28" cy="16" r="0.35"/>
        <circle class="estrella" cx="55" cy="6"  r="0.45"/>
        <circle class="estrella" cx="72" cy="12" r="0.4"/>
        <circle class="estrella" cx="82" cy="24" r="0.35"/>
        <circle class="estrella" cx="8"  cy="28" r="0.4"/>
        <circle class="estrella" cx="38" cy="22" r="0.3"/>
        <circle class="estrella" cx="66" cy="30" r="0.35"/>
        <circle class="estrella" cx="20" cy="40" r="0.28"/>
        <circle class="estrella" cx="78" cy="42" r="0.3"/>
    </g>

    <!-- Halo del sol -->
    <circle cx="45" cy="92" r="40" fill="url(#bod-halo)"/>

    <!-- Sol -->
    <circle class="sol" cx="45" cy="92" r="11" fill="url(#bod-sun)"/>

    <!-- Nubes largas -->
    <g class="nubes" fill="#7C2D12" opacity="0.65">
        <ellipse cx="15" cy="52" rx="14" ry="2.2"/>
        <ellipse cx="20" cy="50" rx="7"  ry="1.6"/>
        <ellipse cx="78" cy="44" rx="13" ry="2"/>
        <ellipse cx="74" cy="42" rx="6"  ry="1.4"/>
        <ellipse cx="52" cy="60" rx="16" ry="2"/>
    </g>

    <!-- Aves -->
    <g stroke="#1E1B4B" stroke-width="0.6" fill="none" opacity="0.85" stroke-linecap="round">
        <path d="M22,35 Q24,33 26,35 Q28,33 30,35"/>
        <path d="M58,28 Q60,26 62,28 Q64,26 66,28"/>
        <path d="M68,38 Q70,36 72,38"/>
        <path d="M14,45 Q16,43 18,45"/>
    </g>

    <!-- Mar -->
    <rect y="105" width="90" height="35" fill="url(#bod-sea)"/>

    <!-- Reflejo del sol sobre el agua -->
    <g class="reflejo">
        <ellipse cx="45" cy="108" rx="7"   ry="1.4" fill="url(#bod-reflect)"/>
        <ellipse cx="45" cy="113" rx="5"   ry="1"   fill="url(#bod-reflect)" opacity="0.75"/>
        <ellipse cx="45" cy="118" rx="3.5" ry="0.8" fill="url(#bod-reflect)" opacity="0.55"/>
        <ellipse cx="45" cy="123" rx="2.2" ry="0.6" fill="url(#bod-reflect)" opacity="0.35"/>
        <ellipse cx="45" cy="128" rx="1.4" ry="0.5" fill="url(#bod-reflect)" opacity="0.2"/>
    </g>

    <!-- Ola 3 (fondo) -->
    <g class="ola-3">
        <path d="M-180,112 Q-169,109 -158,112 T-135,112 T-113,112 T-90,112 T-68,112 T-45,112 T-23,112
                 T0,112 T23,112 T45,112 T68,112 T90,112 T113,112 T135,112 T158,112 T180,112
                 L180,140 L-180,140 Z"
              fill="#2563EB" opacity="0.30"/>
    </g>

    <!-- Ola 2 (media) -->
    <g class="ola-2">
        <path d="M-180,120 Q-169,117 -158,120 T-135,120 T-113,120 T-90,120 T-68,120 T-45,120 T-23,120
                 T0,120 T23,120 T45,120 T68,120 T90,120 T113,120 T135,120 T158,120 T180,120
                 L180,140 L-180,140 Z"
              fill="#0F1E4A" opacity="0.75"/>
    </g>

    <!-- Ola 1 (frente) -->
    <g class="ola-1">
        <path d="M-180,128 Q-169,125 -158,128 T-135,128 T-113,128 T-90,128 T-68,128 T-45,128 T-23,128
                 T0,128 T23,128 T45,128 T68,128 T90,128 T113,128 T135,128 T158,128 T180,128
                 L180,140 L-180,140 Z"
              fill="#020617"/>
    </g>

    <!-- Arena -->
    <path d="M0,138 Q22,132 45,135 T90,138 L90,160 L0,160 Z"
          fill="url(#bod-sand)"/>

    <!-- Espuma -->
    <path d="M0,138 Q22,132 45,135 T90,138"
          stroke="#FED7AA" stroke-width="0.5" fill="none" opacity="0.55"/>

    <!-- Palmera -->
    <g class="palmera">
        <path d="M71,138 C70,128 69,118 68,108 C69,107 70,107 71,108 C72,118 73,128 74,138 Z"
              fill="#0A0500"/>
        <g transform="translate(69.5, 108)" fill="#0A0500">
            <path d="M0,0 C-7,-4 -14,-2 -18,3 C-13,2 -6,2 -1,3 Z"/>
            <path d="M0,0 C-5,-6 -11,-8 -17,-5 C-11,-6 -5,-3 -1,0 Z"/>
            <path d="M0,0 C3,-7 9,-10 15,-8 C10,-7 4,-3 1,0 Z"/>
            <path d="M0,0 C6,-4 12,-3 17,1 C12,0 5,-1 1,1 Z"/>
            <path d="M0,0 C0,-7 0,-13 3,-17 C1,-11 0,-5 0,0 Z"/>
        </g>
    </g>

    <!-- Rocas -->
    <ellipse cx="18" cy="148" rx="3"   ry="1.2" fill="#1C0A02"/>
    <ellipse cx="28" cy="152" rx="2.2" ry="0.9" fill="#2A1205"/>
    <ellipse cx="60" cy="150" rx="2.8" ry="1.1" fill="#1C0A02"/>
    <ellipse cx="50" cy="154" rx="1.8" ry="0.7" fill="#2A1205"/>

    <!-- Reflejos húmedos -->
    <ellipse cx="22" cy="143" rx="4" ry="0.4" fill="#FBBF24" opacity="0.15"/>
    <ellipse cx="68" cy="143" rx="5" ry="0.4" fill="#FBBF24" opacity="0.15"/>
</svg>
</body>
</html>
