<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pixel Bunny</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: #5C94FC;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        svg {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            shape-rendering: crispEdges;
        }

        /* Nubes moviéndose lento (pixel art puro) */
        .nubes {
            animation: nubesMover 20s linear infinite;
        }
        @keyframes nubesMover {
            from { transform: translateX(0); }
            to   { transform: translateX(-90px); }
        }

        /* Conejo: animación de salto controlada desde JS */
        #conejo {
            transition: none;
        }
        #conejo.saltando {
            animation: saltar 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes saltar {
            0%   { transform: translateY(0) scaleY(1); }
            15%  { transform: translateY(0) scaleY(0.75) scaleX(1.15); }
            45%  { transform: translateY(-14px) scaleY(1.15) scaleX(0.9); }
            75%  { transform: translateY(0) scaleY(0.85) scaleX(1.1); }
            100% { transform: translateY(0) scaleY(1); }
        }

        /* Orejitas del conejo oscilando */
        .orejas {
            transform-box: view-box;
            transform-origin: 45px 75px;
            animation: orejasOsc 2.2s ease-in-out infinite;
        }
        @keyframes orejasOsc {
            0%, 100% { transform: rotate(-2deg); }
            50%      { transform: rotate(2deg); }
        }

        /* Sombra pulsante debajo del conejo cuando salta */
        .sombra-conejo {
            animation: sombraPulso 2s ease-in-out infinite;
        }
        @keyframes sombraPulso {
            0%, 100% { opacity: 0.35; transform: scaleX(1); }
            50%      { opacity: 0.2;  transform: scaleX(0.85); }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <!-- Fondo azul cielo pixel por pixel -->
    <rect width="90" height="160" fill="#5C94FC"/>

    <!-- Nubes pixel art -->
    <g class="nubes" fill="#F8F8F8">
        <!-- Nube 1 -->
        <g>
            <rect x="10" y="25" width="4" height="4"/>
            <rect x="14" y="21" width="4" height="4"/>
            <rect x="18" y="17" width="4" height="4"/>
            <rect x="22" y="17" width="4" height="4"/>
            <rect x="26" y="21" width="4" height="4"/>
            <rect x="30" y="21" width="4" height="4"/>
            <rect x="34" y="25" width="4" height="4"/>
            <rect x="18" y="25" width="16" height="4"/>
            <rect x="14" y="25" width="4" height="4"/>
            <rect x="30" y="25" width="4" height="4"/>
            <rect x="22" y="21" width="4" height="4"/>
        </g>
        <!-- Nube 2 -->
        <g>
            <rect x="60" y="40" width="4" height="4"/>
            <rect x="64" y="36" width="4" height="4"/>
            <rect x="68" y="36" width="4" height="4"/>
            <rect x="72" y="40" width="4" height="4"/>
            <rect x="76" y="44" width="4" height="4"/>
            <rect x="64" y="40" width="12" height="4"/>
        </g>
        <!-- Nube 3 -->
        <g>
            <rect x="30" y="55" width="4" height="4"/>
            <rect x="34" y="51" width="4" height="4"/>
            <rect x="38" y="51" width="4" height="4"/>
            <rect x="42" y="55" width="4" height="4"/>
            <rect x="34" y="55" width="8" height="4"/>
        </g>
    </g>

    <!-- Suelo: pasto pixel -->
    <rect x="0" y="130" width="90" height="4" fill="#00A800"/>
    <rect x="0" y="134" width="90" height="4" fill="#009000"/>
    <rect x="0" y="138" width="90" height="22" fill="#8B4513"/>

    <!-- Detalles del pasto (píxeles individuales) -->
    <g fill="#00C800">
        <rect x="8" y="128" width="2" height="2"/>
        <rect x="24" y="128" width="2" height="2"/>
        <rect x="40" y="128" width="2" height="2"/>
        <rect x="56" y="128" width="2" height="2"/>
        <rect x="72" y="128" width="2" height="2"/>
        <rect x="84" y="128" width="2" height="2"/>
    </g>

    <!-- Detalles de tierra -->
    <g fill="#6B3410">
        <rect x="10" y="142" width="2" height="2"/>
        <rect x="30" y="146" width="2" height="2"/>
        <rect x="50" y="144" width="2" height="2"/>
        <rect x="70" y="148" width="2" height="2"/>
        <rect x="20" y="152" width="2" height="2"/>
        <rect x="60" y="154" width="2" height="2"/>
    </g>

    <!-- Sombra pulsante debajo del conejo -->
    <ellipse class="sombra-conejo" cx="45" cy="130" rx="14" ry="2" fill="#000000" opacity="0.35"/>

    <!-- Conejo pixel art (cada "píxel" = 2 unidades) -->
    <g id="conejo">
        <g transform="translate(29, 84)">
            <!-- Orejas largas -->
            <g class="orejas">
                <!-- Oreja izquierda (contorno) -->
                <rect x="4" y="-14" width="2" height="2" fill="#000000"/>
                <rect x="4" y="-12" width="2" height="2" fill="#000000"/>
                <rect x="4" y="-10" width="2" height="2" fill="#000000"/>
                <rect x="4" y="-8"  width="2" height="2" fill="#000000"/>
                <rect x="4" y="-6"  width="2" height="2" fill="#000000"/>
                <rect x="6" y="-14" width="2" height="2" fill="#000000"/>
                <rect x="2" y="-12" width="2" height="2" fill="#000000"/>
                <rect x="2" y="-10" width="2" height="2" fill="#000000"/>
                <rect x="2" y="-8"  width="2" height="2" fill="#000000"/>
                <rect x="6" y="-6"  width="2" height="2" fill="#000000"/>
                <rect x="2" y="-6"  width="2" height="2" fill="#000000"/>
                <!-- Interior rosa -->
                <rect x="4" y="-12" width="2" height="2" fill="#F8B8F8"/>
                <rect x="4" y="-10" width="2" height="2" fill="#F8B8F8"/>
                <rect x="4" y="-8"  width="2" height="2" fill="#F8B8F8"/>

                <!-- Oreja derecha -->
                <rect x="14" y="-14" width="2" height="2" fill="#000000"/>
                <rect x="14" y="-12" width="2" height="2" fill="#000000"/>
                <rect x="14" y="-10" width="2" height="2" fill="#000000"/>
                <rect x="14" y="-8"  width="2" height="2" fill="#000000"/>
                <rect x="14" y="-6"  width="2" height="2" fill="#000000"/>
                <rect x="16" y="-12" width="2" height="2" fill="#000000"/>
                <rect x="18" y="-10" width="2" height="2" fill="#000000"/>
                <rect x="18" y="-8"  width="2" height="2" fill="#000000"/>
                <rect x="16" y="-6"  width="2" height="2" fill="#000000"/>
                <rect x="14" y="-12" width="2" height="2" fill="#F8B8F8"/>
                <rect x="14" y="-10" width="2" height="2" fill="#F8B8F8"/>
                <rect x="14" y="-8"  width="2" height="2" fill="#F8B8F8"/>
            </g>

            <!-- Cabeza -->
            <rect x="6"  y="-6" width="2" height="2" fill="#000000"/>
            <rect x="8"  y="-8" width="2" height="2" fill="#000000"/>
            <rect x="10" y="-8" width="2" height="2" fill="#000000"/>
            <rect x="12" y="-8" width="2" height="2" fill="#000000"/>
            <rect x="14" y="-6" width="2" height="2" fill="#000000"/>
            <rect x="4"  y="-4" width="2" height="2" fill="#000000"/>
            <rect x="16" y="-4" width="2" height="2" fill="#000000"/>
            <rect x="4"  y="-2" width="2" height="2" fill="#000000"/>
            <rect x="16" y="-2" width="2" height="2" fill="#000000"/>
            <rect x="6"  y="0"  width="2" height="2" fill="#000000"/>
            <rect x="8"  y="0"  width="2" height="2" fill="#000000"/>
            <rect x="10" y="0"  width="2" height="2" fill="#000000"/>
            <rect x="12" y="0"  width="2" height="2" fill="#000000"/>
            <rect x="14" y="0"  width="2" height="2" fill="#000000"/>

            <!-- Relleno blanco de la cabeza -->
            <rect x="6"  y="-6" width="10" height="2" fill="#F8F8F8"/>
            <rect x="6"  y="-4" width="10" height="2" fill="#F8F8F8"/>
            <rect x="6"  y="-2" width="10" height="2" fill="#F8F8F8"/>

            <!-- Ojos (negros) -->
            <rect x="7"  y="-5" width="2" height="2" fill="#000000"/>
            <rect x="13" y="-5" width="2" height="2" fill="#000000"/>
            <!-- Brillo en los ojos -->
            <rect x="7"  y="-5" width="1" height="1" fill="#FFFFFF" opacity="0.8"/>
            <rect x="13" y="-5" width="1" height="1" fill="#FFFFFF" opacity="0.8"/>

            <!-- Naricita rosa -->
            <rect x="10" y="-2" width="2" height="2" fill="#F8B8F8"/>
            <!-- Bigotes -->
            <rect x="4"  y="-2" width="2" height="1" fill="#000000" opacity="0.6"/>
            <rect x="16" y="-2" width="2" height="1" fill="#000000" opacity="0.6"/>

            <!-- Cuerpo -->
            <rect x="4"  y="0" width="14" height="2" fill="#000000"/>
            <rect x="2"  y="2" width="18" height="2" fill="#000000"/>
            <rect x="2"  y="4" width="18" height="2" fill="#000000"/>
            <rect x="2"  y="6" width="18" height="2" fill="#000000"/>
            <rect x="2"  y="8" width="18" height="2" fill="#000000"/>
            <rect x="2"  y="10" width="18" height="2" fill="#000000"/>
            <rect x="4"  y="12" width="14" height="2" fill="#000000"/>

            <!-- Relleno blanco del cuerpo -->
            <rect x="4"  y="0" width="14" height="2" fill="#F8F8F8"/>
            <rect x="4"  y="2" width="14" height="2" fill="#F8F8F8"/>
            <rect x="4"  y="4" width="14" height="2" fill="#F8F8F8"/>
            <rect x="4"  y="6" width="14" height="2" fill="#F8F8F8"/>
            <rect x="4"  y="8" width="14" height="2" fill="#F8F8F8"/>
            <rect x="4"  y="10" width="14" height="2" fill="#F8F8F8"/>

            <!-- Panza (color más oscuro) -->
            <rect x="8"  y="6" width="6" height="2" fill="#E8E8E8"/>
            <rect x="8"  y="8" width="6" height="2" fill="#E8E8E8"/>

            <!-- Patitas traseras -->
            <rect x="0"  y="12" width="4" height="2" fill="#000000"/>
            <rect x="18" y="12" width="4" height="2" fill="#000000"/>
            <rect x="2"  y="12" width="2" height="2" fill="#F8F8F8"/>
            <rect x="18" y="12" width="2" height="2" fill="#F8F8F8"/>

            <!-- Cola (pom-pom blanco) -->
            <rect x="18" y="4" width="2" height="2" fill="#F8F8F8"/>
            <rect x="20" y="6" width="2" height="2" fill="#F8F8F8"/>
            <rect x="18" y="8" width="2" height="2" fill="#F8F8F8"/>
        </g>
    </g>
</svg>

<script>
    // ============================================================
    //  Pixel Bunny — salta al tocarlo
    // ============================================================
    (function () {
        'use strict';

        const conejo = document.getElementById('conejo');
        if (!conejo) return;

        let saltando = false;

        function saltar() {
            if (saltando) return;
            saltando = true;

            conejo.classList.add('saltando');

            // Cuando la animación CSS termina, quitamos la clase
            conejo.addEventListener('animationend', () => {
                conejo.classList.remove('saltando');
                saltando = false;
            }, { once: true });
        }

        // Detectar click o tap en cualquier parte del cuadro
        document.addEventListener('click', saltar);
        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            saltar();
        }, { passive: false });
    })();
</script>
</body>
</html>
