<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pixel Bunny</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: #5C94FC;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        svg {
            display: block;
            width: 100%;
            height: 100%;
            shape-rendering: crispEdges;
        }

        /* Nubes pixel moviéndose */
        .nubes {
            animation: nubesMover 24s linear infinite;
        }
        @keyframes nubesMover {
            from { transform: translateX(0); }
            to   { transform: translateX(-90px); }
        }

        /* Grupo del conejo: acá va el salto */
        #conejo {
            transform-box: view-box;
            transform-origin: 45px 130px;
        }
        #conejo.saltando {
            animation: saltar 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes saltar {
            0%   { transform: translateY(0)    scaleY(1)    scaleX(1); }
            15%  { transform: translateY(0)    scaleY(0.75) scaleX(1.12); }
            45%  { transform: translateY(-14px) scaleY(1.15) scaleX(0.92); }
            75%  { transform: translateY(0)    scaleY(0.85) scaleX(1.08); }
            100% { transform: translateY(0)    scaleY(1)    scaleX(1); }
        }

        /* Orejas oscilando (coordenadas absolutas) */
        .orejas {
            transform-box: view-box;
            transform-origin: 45px 108px;
            animation: orejasOsc 2.2s ease-in-out infinite;
        }
        @keyframes orejasOsc {
            0%, 100% { transform: rotate(-3deg); }
            50%      { transform: rotate(3deg); }
        }

        /* Sombra palpitando */
        .sombra-conejo {
            animation: sombraPulso 2s ease-in-out infinite;
            transform-box: view-box;
            transform-origin: 45px 130px;
        }
        @keyframes sombraPulso {
            0%, 100% { opacity: 0.35; transform: scaleX(1); }
            50%      { opacity: 0.2;  transform: scaleX(0.85); }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <!-- CIELO -->
    <rect width="90" height="160" fill="#5C94FC"/>

    <!-- NUBES pixel -->
    <g class="nubes" fill="#F8F8F8">
        <g>
            <rect x="10" y="25" width="4" height="4"/>
            <rect x="14" y="21" width="4" height="4"/>
            <rect x="18" y="17" width="4" height="4"/>
            <rect x="22" y="17" width="4" height="4"/>
            <rect x="26" y="21" width="4" height="4"/>
            <rect x="30" y="21" width="4" height="4"/>
            <rect x="34" y="25" width="4" height="4"/>
            <rect x="14" y="25" width="4" height="4"/>
            <rect x="18" y="21" width="12" height="4"/>
            <rect x="18" y="25" width="16" height="4"/>
        </g>
        <g>
            <rect x="60" y="40" width="4" height="4"/>
            <rect x="64" y="36" width="4" height="4"/>
            <rect x="68" y="36" width="4" height="4"/>
            <rect x="72" y="40" width="4" height="4"/>
            <rect x="64" y="40" width="12" height="4"/>
        </g>
    </g>

    <!-- SUELO -->
    <rect x="0" y="130" width="90" height="4" fill="#00A800"/>
    <rect x="0" y="134" width="90" height="4" fill="#009000"/>
    <rect x="0" y="138" width="90" height="22" fill="#8B4513"/>

    <!-- Detalles pasto -->
    <g fill="#00C800">
        <rect x="8" y="128" width="2" height="2"/>
        <rect x="24" y="128" width="2" height="2"/>
        <rect x="40" y="128" width="2" height="2"/>
        <rect x="56" y="128" width="2" height="2"/>
        <rect x="72" y="128" width="2" height="2"/>
        <rect x="84" y="128" width="2" height="2"/>
    </g>

    <!-- Detalles tierra -->
    <g fill="#6B3410">
        <rect x="10" y="142" width="2" height="2"/>
        <rect x="30" y="146" width="2" height="2"/>
        <rect x="50" y="144" width="2" height="2"/>
        <rect x="70" y="148" width="2" height="2"/>
        <rect x="20" y="152" width="2" height="2"/>
        <rect x="60" y="154" width="2" height="2"/>
    </g>

    <!-- Sombra debajo del conejo -->
    <ellipse class="sombra-conejo" cx="45" cy="130" rx="16" ry="2.5" fill="#000000" opacity="0.35"/>

    <!-- =========================================================
         CONEJO — todas las coordenadas ABSOLUTAS
         Área reservada: x=27..63, y=86..130
         ========================================================= -->
    <g id="conejo">

        <!-- OREJAS (van dentro del grupo que oscila) -->
        <g class="orejas">
            <!-- Oreja izquierda -->
            <!-- Contorno negro -->
            <rect x="38" y="86" width="6" height="22" fill="#000000"/>
            <!-- Relleno blanco -->
            <rect x="40" y="88" width="2" height="18" fill="#F8F8F8"/>
            <!-- Interior rosa -->
            <rect x="40" y="90" width="2" height="12" fill="#F8B8F8"/>

            <!-- Oreja derecha -->
            <rect x="46" y="86" width="6" height="22" fill="#000000"/>
            <rect x="48" y="88" width="2" height="18" fill="#F8F8F8"/>
            <rect x="48" y="90" width="2" height="12" fill="#F8B8F8"/>
        </g>

        <!-- CABEZA -->
        <!-- Contorno -->
        <rect x="34" y="106" width="22" height="18" fill="#000000"/>
        <!-- Relleno blanco -->
        <rect x="36" y="108" width="18" height="14" fill="#F8F8F8"/>

        <!-- OJOS (negros con brillo) -->
        <rect x="38" y="112" width="4" height="4" fill="#000000"/>
        <rect x="48" y="112" width="4" height="4" fill="#000000"/>
        <rect x="38" y="112" width="2" height="2" fill="#FFFFFF"/>
        <rect x="48" y="112" width="2" height="2" fill="#FFFFFF"/>

        <!-- NARIZ rosa -->
        <rect x="43" y="118" width="4" height="2" fill="#F8B8F8"/>
        <!-- Bigotes negros (líneas finas) -->
        <rect x="30" y="118" width="4" height="1" fill="#000000" opacity="0.7"/>
        <rect x="56" y="118" width="4" height="1" fill="#000000" opacity="0.7"/>

        <!-- Mejillas suaves -->
        <rect x="36" y="116" width="2" height="2" fill="#F8B8F8" opacity="0.7"/>
        <rect x="52" y="116" width="2" height="2" fill="#F8B8F8" opacity="0.7"/>

        <!-- CUERPO -->
        <!-- Contorno -->
        <rect x="32" y="124" width="26" height="6" fill="#000000"/>
        <!-- Relleno -->
        <rect x="34" y="125" width="22" height="4" fill="#F8F8F8"/>

        <!-- Patitas delanteras (dos rectángulos inferiores) -->
        <rect x="32" y="128" width="4" height="2" fill="#000000"/>
        <rect x="54" y="128" width="4" height="2" fill="#000000"/>
        <rect x="34" y="128" width="2" height="2" fill="#F8F8F8"/>
        <rect x="54" y="128" width="2" height="2" fill="#F8F8F8"/>

        <!-- Colita pom-pom (lado derecho) -->
        <rect x="58" y="122" width="2" height="2" fill="#F8F8F8"/>
        <rect x="60" y="124" width="2" height="2" fill="#F8F8F8"/>
        <rect x="58" y="126" width="2" height="2" fill="#F8F8F8"/>

        <!-- Cola a rayas (opcional, sutil) -->
        <rect x="30" y="120" width="4" height="4" fill="#F8F8F8"/>
        <rect x="56" y="120" width="4" height="4" fill="#F8F8F8"/>
    </g>
</svg>

<script>
    (function () {
        'use strict';

        const conejo = document.getElementById('conejo');
        if (!conejo) return;

        let saltando = false;

        function saltar() {
            if (saltando) return;
            saltando = true;
            conejo.classList.add('saltando');

            conejo.addEventListener('animationend', () => {
                conejo.classList.remove('saltando');
                saltando = false;
            }, { once: true });
        }

        document.addEventListener('click', saltar);
        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            saltar();
        }, { passive: false });
    })();
</script>
</body>
</html>
