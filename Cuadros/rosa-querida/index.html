<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Querida</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #FFF1F5;
        }
        svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Balanceo suave de la rosa (grupo exterior sin transform attr) */
        .rosa-anim {
            transform-box: view-box;
            transform-origin: 45px 55px;
            animation: rosaBalanceo 3.5s ease-in-out infinite;
        }
        @keyframes rosaBalanceo {
            0%, 100% { transform: rotate(-2deg); }
            50%      { transform: rotate(2deg); }
        }

        .hoja-izq {
            transform-box: view-box;
            transform-origin: 44px 100px;
            animation: hojaIzq 3s ease-in-out infinite;
        }
        .hoja-der {
            transform-box: view-box;
            transform-origin: 45px 120px;
            animation: hojaDer 3.5s ease-in-out infinite;
        }
        @keyframes hojaIzq {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(-3deg); }
        }
        @keyframes hojaDer {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(3deg); }
        }

        .brillo {
            animation: brillo 2.5s ease-in-out infinite;
        }
        @keyframes brillo {
            0%, 100% { opacity: 0.4; }
            50%      { opacity: 0.9; }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="rk-bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#FFF5F8"/>
            <stop offset="0.5" stop-color="#FCE7F3"/>
            <stop offset="1"   stop-color="#FBCFE8"/>
        </linearGradient>
        <radialGradient id="rk-glow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0"   stop-color="#FB7185" stop-opacity="0.35"/>
            <stop offset="0.6" stop-color="#FB7185" stop-opacity="0.08"/>
            <stop offset="1"   stop-color="#FB7185" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="rk-stem" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#15803D"/>
            <stop offset="1" stop-color="#22C55E"/>
        </linearGradient>
        <linearGradient id="rk-leaf" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#34D399"/>
            <stop offset="1" stop-color="#15803D"/>
        </linearGradient>
    </defs>

    <!-- Fondo -->
    <rect width="90" height="160" fill="url(#rk-bg)"/>

    <!-- Halo detrás de la rosa -->
    <circle cx="45" cy="55" r="42" fill="url(#rk-glow)"/>

    <!-- Tallo -->
    <path d="M45,68 C43,92 44,122 46,152"
          stroke="url(#rk-stem)" stroke-width="2.5"
          fill="none" stroke-linecap="round"/>

    <!-- Espinas -->
    <path d="M43,82 L39,80 L43,84 Z" fill="#15803D"/>
    <path d="M47,106 L51,104 L47,108 Z" fill="#15803D"/>

    <!-- Hoja izquierda (con venas) -->
    <g class="hoja-izq">
        <path d="M44,100 C32,92 24,98 22,110 C32,116 40,112 44,104 Z"
              fill="url(#rk-leaf)"/>
        <path d="M44,100 C38,100 30,104 24,108"
              stroke="#15803D" stroke-width="0.5" fill="none" opacity="0.55"/>
        <path d="M40,102 L34,105" stroke="#15803D" stroke-width="0.3" opacity="0.4"/>
        <path d="M36,105 L32,110" stroke="#15803D" stroke-width="0.3" opacity="0.4"/>
    </g>

    <!-- Hoja derecha (con venas) -->
    <g class="hoja-der">
        <path d="M45,120 C57,113 65,119 67,131 C57,137 49,133 45,125 Z"
              fill="url(#rk-leaf)"/>
        <path d="M45,120 C51,120 59,124 65,128"
              stroke="#15803D" stroke-width="0.5" fill="none" opacity="0.55"/>
        <path d="M49,122 L55,125" stroke="#15803D" stroke-width="0.3" opacity="0.4"/>
        <path d="M54,125 L60,130" stroke="#15803D" stroke-width="0.3" opacity="0.4"/>
    </g>

    <!-- Rosa: wrapper SIN transform attr → CSS manda -->
    <g class="rosa-anim">
        <!-- Grupo INTERNO con transform attr (translate) -->
        <g transform="translate(45,55)">
            <!-- Pétalos externos (atrás) -->
            <path d="M-22,5 C-24,-13 -11,-24 5,-22 C22,-20 24,-3 19,9 C16,19 0,22 -11,16 C-20,12 -21,11 -22,5 Z"
                  fill="#BE123C"/>
            <path d="M-20,-8 C-15,-22 0,-26 11,-20 C20,-15 22,-3 16,6 C11,-3 0,-7 -8,-3 Z"
                  fill="#9F1239"/>

            <!-- Pétalos medios -->
            <path d="M-17,3 C-17,-9 -7,-17 5,-14 C16,-12 18,-1 14,7 C12,13 0,15 -8,12 C-14,9 -17,7 -17,3 Z"
                  fill="#E11D48"/>
            <path d="M-13,-6 C-9,-15 2,-17 9,-11 C14,-7 13,1 7,5 C0,-1 -6,-3 -11,-1 Z"
                  fill="#F43F5E"/>

            <!-- Pétalos internos -->
            <path d="M-10,1 C-10,-7 -3,-11 4,-9 C10,-7 11,1 9,6 C7,10 0,11 -4,8 C-8,6 -10,5 -10,1 Z"
                  fill="#FB7185"/>
            <path d="M-7,-4 C-5,-10 2,-10 6,-6 C8,-3 6,2 3,3 C0,1 -3,-1 -6,-2 Z"
                  fill="#F43F5E"/>

            <!-- Centro -->
            <path d="M-4,0 C-4,-5 0,-7 4,-4 C6,-2 5,2 2,3 C-1,4 -4,3 -4,0 Z"
                  fill="#FDA4AF"/>

            <!-- Espiral del centro -->
            <path d="M-2,0 C-2,-2 2,-3 3,-1 C4,1 1,3 -1,1 C-2,1 -2,0 -2,0"
                  fill="none" stroke="#9F1239" stroke-width="0.6" stroke-linecap="round"/>
            <circle cx="1" cy="-1" r="0.6" fill="#9F1239" opacity="0.7"/>
        </g>
    </g>

    <!-- Brillo suave (destello) -->
    <g class="brillo">
        <circle cx="38" cy="48" r="1.2" fill="#FFFFFF" opacity="0.7"/>
        <circle cx="52" cy="52" r="0.8" fill="#FFFFFF" opacity="0.5"/>
        <circle cx="34" cy="60" r="0.6" fill="#FFFFFF" opacity="0.4"/>
    </g>
</svg>
</body>
</html>
