<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sandía</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #FFF5F8 0%, #FCE7F3 55%, #FBCFE8 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        .sandia {
            transform-box: view-box;
            transform-origin: 45px 90px;
            animation: flotar 4s ease-in-out infinite;
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0) rotate(-1.5deg); }
            50%      { transform: translateY(-3px) rotate(1.5deg); }
        }

        .brillo {
            animation: brilloPulso 3s ease-in-out infinite;
        }
        @keyframes brilloPulso {
            0%, 100% { opacity: 0.5; }
            50%      { opacity: 0.9; }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="sd-body" cx="0.35" cy="0.3" r="0.85">
            <stop offset="0"   stop-color="#4ADE80"/>
            <stop offset="0.5" stop-color="#16A34A"/>
            <stop offset="1"   stop-color="#14532D"/>
        </radialGradient>
    </defs>

    <!-- Sombra en el piso -->
    <ellipse cx="45" cy="128" rx="28" ry="3" fill="#14532D" opacity="0.18"/>

    <g class="sandia">
        <!-- Cuerpo ovalado -->
        <ellipse cx="45" cy="90" rx="28" ry="34" fill="url(#sd-body)"/>

        <!-- Rayas verde oscuro (de arriba a abajo, siguiendo la curva) -->
        <g stroke="#14532D" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round">
            <path d="M25,66 Q22,90 25,114"/>
            <path d="M33,60 Q30,90 33,120"/>
            <path d="M45,56 Q45,90 45,124"/>
            <path d="M57,60 Q60,90 57,120"/>
            <path d="M65,66 Q68,90 65,114"/>
        </g>

        <!-- Rayas verde claro (entre las oscuras, más finitas) -->
        <g stroke="#22C55E" stroke-width="0.9" fill="none" opacity="0.6" stroke-linecap="round">
            <path d="M29,63 Q26,90 29,117"/>
            <path d="M39,58 Q37,90 39,122"/>
            <path d="M51,58 Q53,90 51,122"/>
            <path d="M61,63 Q64,90 61,117"/>
        </g>

        <!-- Brillito superior izquierdo -->
        <ellipse class="brillo" cx="32" cy="72" rx="7" ry="5" fill="white"
                 transform="rotate(-30 32 72)"/>

        <!-- Rayito de brillo cruzado -->
        <line class="brillo" x1="26" y1="70" x2="38" y2="74"
              stroke="white" stroke-width="0.8" stroke-linecap="round"
              opacity="0.7"/>

        <!-- Tapa verde oscuro arriba (donde estaba el tallo) -->
        <ellipse cx="45" cy="57" rx="6" ry="2.5" fill="#14532D" opacity="0.85"/>
        <ellipse cx="45" cy="56" rx="3" ry="1.4" fill="#0F3D1F" opacity="0.7"/>
    </g>
</svg>
</body>
</html>
