<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sandía</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #FFF5F8 0%, #FCE7F3 55%, #FBCFE8 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        .sandia {
            transform-box: view-box;
            transform-origin: 45px 90px;
            animation: flotar 4s ease-in-out infinite;
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0)    rotate(-1deg); }
            50%      { transform: translateY(-3px) rotate(1deg); }
        }

        .semilla {
            transform-box: fill-box;
            transform-origin: center;
            animation: semillaBrillo 3s ease-in-out infinite;
        }
        .semilla:nth-child(odd)  { animation-delay: 0.5s; }
        .semilla:nth-child(3n)   { animation-delay: 1.1s; }
        @keyframes semillaBrillo {
            0%, 100% { opacity: 0.7; }
            50%      { opacity: 1; }
        }

        /* Chispitas que titilan sobre la pulpa */
        .chispa {
            transform-box: fill-box;
            transform-origin: center;
            animation: chispa 2s ease-in-out infinite;
        }
        .chispa:nth-child(2n) { animation-delay: 0.5s; }
        .chispa:nth-child(3n) { animation-delay: 1s; }
        @keyframes chispa {
            0%, 100% { opacity: 0;   transform: scale(0.4); }
            50%      { opacity: 0.9; transform: scale(1); }
        }

        /* Brillo que recorre la sandía */
        .brillo-paseo {
            animation: brilloPaseo 4s ease-in-out infinite;
        }
        @keyframes brilloPaseo {
            0%, 100% { opacity: 0.35; transform: translateX(-6px); }
            50%      { opacity: 0.55; transform: translateX(6px); }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="sd-rind" cx="0.5" cy="0" r="0.9">
            <stop offset="0"   stop-color="#22C55E"/>
            <stop offset="0.7" stop-color="#15803D"/>
            <stop offset="1"   stop-color="#14532D"/>
        </radialGradient>
        <radialGradient id="sd-flesh" cx="0.5" cy="0.15" r="0.9">
            <stop offset="0"   stop-color="#FB7185"/>
            <stop offset="0.55" stop-color="#E11D48"/>
            <stop offset="1"   stop-color="#9F1239"/>
        </radialGradient>
    </defs>

    <!-- Sombra elíptica en el piso -->
    <ellipse cx="45" cy="128" rx="40" ry="4" fill="#9F1239" opacity="0.15"/>

    <g class="sandia">

        <!-- CORONA VERDE -->
        <path d="M4,68 A41,41 0 0 0 86,68 Z" fill="url(#sd-rind)"/>

        <!-- Rayitas oscuras de la corteza -->
        <g stroke="#052E16" stroke-width="0.7" fill="none" opacity="0.35">
            <path d="M8,78  Q18,98 30,108"/>
            <path d="M20,72 Q28,96 42,110"/>
            <path d="M70,72 Q62,96 48,110"/>
            <path d="M82,78 Q72,98 60,108"/>
        </g>

        <!-- Capa blanca interna -->
        <path d="M9,70 A36,36 0 0 0 81,70 Z" fill="#F0FDF4"/>

        <!-- PULPA ROJA -->
        <path d="M14,72 A31,31 0 0 0 76,72 Z" fill="url(#sd-flesh)"/>

        <!-- Brillo que se pasea por la pulpa -->
        <ellipse class="brillo-paseo"
                 cx="32" cy="86" rx="6" ry="3"
                 fill="white" opacity="0.35"
                 transform="rotate(-25 32 86)"/>

        <!-- SEMILLAS (rotadas apuntando hacia afuera) -->
        <g fill="#0F172A">
            <ellipse class="semilla" cx="33" cy="84" rx="1.1" ry="1.7"
                     transform="rotate(-35 33 84)"/>
            <ellipse class="semilla" cx="45" cy="80" rx="1.1" ry="1.7"/>
            <ellipse class="semilla" cx="57" cy="84" rx="1.1" ry="1.7"
                     transform="rotate(35 57 84)"/>

            <ellipse class="semilla" cx="30" cy="95" rx="1.1" ry="1.7"
                     transform="rotate(-55 30 95)"/>
            <ellipse class="semilla" cx="41" cy="92" rx="1.1" ry="1.7"
                     transform="rotate(-15 41 92)"/>
            <ellipse class="semilla" cx="49" cy="92" rx="1.1" ry="1.7"
                     transform="rotate(15 49 92)"/>
            <ellipse class="semilla" cx="60" cy="95" rx="1.1" ry="1.7"
                     transform="rotate(55 60 95)"/>

            <ellipse class="semilla" cx="45" cy="100" rx="1" ry="1.5"/>
        </g>

        <!-- CHISPAS que titilan sobre la pulpa (reemplazan las gotas flotantes) -->
        <g fill="#FFF7ED">
            <circle class="chispa" cx="38" cy="80" r="0.7"/>
            <circle class="chispa" cx="52" cy="82" r="0.6"/>
            <circle class="chispa" cx="35" cy="90" r="0.5"/>
            <circle class="chispa" cx="55" cy="88" r="0.6"/>
            <circle class="chispa" cx="45" cy="94" r="0.5"/>
            <circle class="chispa" cx="42" cy="86" r="0.4"/>
        </g>
    </g>
</svg>
</body>
</html>
