<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sandía</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #FFF1F5 0%, #FCE7F3 55%, #FBCFE8 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        .sandia {
            transform-box: view-box;
            transform-origin: 45px 82px;
            animation: flotar 4s ease-in-out infinite;
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0)    rotate(-1deg); }
            50%      { transform: translateY(-3px) rotate(1deg); }
        }

        .semilla {
            transform-box: fill-box;
            transform-origin: center;
            animation: semillaBrillo 3s ease-in-out infinite;
        }
        .semilla:nth-child(odd)  { animation-delay: 0.5s; }
        .semilla:nth-child(3n)   { animation-delay: 1.1s; }
        @keyframes semillaBrillo {
            0%, 100% { opacity: 0.75; }
            50%      { opacity: 1; }
        }

        .gota {
            transform-box: fill-box;
            transform-origin: center;
            animation: gotaPulso 2s ease-in-out infinite;
        }
        .gota:nth-child(2) { animation-delay: 0.4s; }
        .gota:nth-child(3) { animation-delay: 0.8s; }
        @keyframes gotaPulso {
            0%, 100% { transform: scale(1);   opacity: 0.55; }
            50%      { transform: scale(1.2); opacity: 1; }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="sd-rind" cx="0.5" cy="0" r="0.9">
            <stop offset="0"   stop-color="#22C55E"/>
            <stop offset="0.7" stop-color="#15803D"/>
            <stop offset="1"   stop-color="#14532D"/>
        </radialGradient>
        <radialGradient id="sd-flesh" cx="0.5" cy="0.2" r="0.85">
            <stop offset="0"   stop-color="#FB7185"/>
            <stop offset="0.6" stop-color="#E11D48"/>
            <stop offset="1"   stop-color="#9F1239"/>
        </radialGradient>
    </defs>

    <!-- Sombra elíptica -->
    <ellipse cx="45" cy="115" rx="36" ry="3.5" fill="#9F1239" opacity="0.15"/>

    <g class="sandia">

        <!-- CORONA VERDE (corteza exterior) -->
        <path d="M10,78 A35,35 0 0 0 80,78 Z" fill="url(#sd-rind)"/>
        <!-- Rayitas oscuras de la corteza -->
        <path d="M14,86 Q22,102 30,108"
              stroke="#052E16" stroke-width="0.7" fill="none" opacity="0.35"/>
        <path d="M22,80 Q28,98 38,108"
              stroke="#052E16" stroke-width="0.6" fill="none" opacity="0.3"/>
        <path d="M68,80 Q62,98 52,108"
              stroke="#052E16" stroke-width="0.6" fill="none" opacity="0.3"/>
        <path d="M76,86 Q68,102 60,108"
              stroke="#052E16" stroke-width="0.7" fill="none" opacity="0.35"/>

        <!-- CAPA BLANCA INTERNA -->
        <path d="M14,80 A31,31 0 0 0 76,80 Z" fill="#F0FDF4"/>

        <!-- PULPA ROJA -->
        <path d="M18,82 A27,27 0 0 0 72,82 Z" fill="url(#sd-flesh)"/>

        <!-- BRILLO en la pulpa -->
        <ellipse cx="32" cy="92" rx="6" ry="2.5" fill="white" opacity="0.35"
                 transform="rotate(-25 32 92)"/>
        <ellipse cx="58" cy="94" rx="4" ry="1.5" fill="white" opacity="0.2"
                 transform="rotate(20 58 94)"/>

        <!-- SEMILLAS -->
        <g fill="#0F172A">
            <ellipse class="semilla" cx="34" cy="94" rx="1.2" ry="1.7"/>
            <ellipse class="semilla" cx="45" cy="92" rx="1.2" ry="1.7"/>
            <ellipse class="semilla" cx="56" cy="94" rx="1.2" ry="1.7"/>
            <ellipse class="semilla" cx="39" cy="102" rx="1.2" ry="1.7"/>
            <ellipse class="semilla" cx="51" cy="102" rx="1.2" ry="1.7"/>
            <ellipse class="semilla" cx="45" cy="106" rx="1.1" ry="1.5"/>
            <ellipse class="semilla" cx="30" cy="102" rx="1"   ry="1.4"/>
            <ellipse class="semilla" cx="60" cy="102" rx="1"   ry="1.4"/>
        </g>

        <!-- GOTITAS DE JUGO -->
        <g fill="#FDA4AF">
            <ellipse class="gota" cx="20" cy="72" rx="1.4" ry="1.8"/>
            <ellipse class="gota" cx="70" cy="72" rx="1.4" ry="1.8"/>
            <ellipse class="gota" cx="45" cy="70" rx="1"   ry="1.3" opacity="0.7"/>
        </g>
    </g>
</svg>
</body>
</html>
