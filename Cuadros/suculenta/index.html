<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suculenta Roseta</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #ECFDF5 0%, #D1FAE5 60%, #A7F3D0 100%);
        }
        svg { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <!-- Sombra en el piso -->
    <ellipse cx="45" cy="142" rx="22" ry="3" fill="#14532D" opacity="0.15"/>

    <!-- Roseta: se mece desde la base de la maceta (45,120) -->
    <g>
        <animateTransform attributeName="transform" type="rotate"
            values="-1.5 45 120;1.5 45 120;-1.5 45 120" dur="5s" repeatCount="indefinite"/>

        <!-- Hojas exteriores (más oscuras) -->
        <path d="M45,120 C37,110 36,94 45,80 C54,94 53,110 45,120 Z" fill="#16A34A" transform="rotate(-72 45 120)"/>
        <path d="M45,120 C37,110 36,94 45,80 C54,94 53,110 45,120 Z" fill="#16A34A" transform="rotate(72 45 120)"/>
        <path d="M45,120 C37,110 36,94 45,80 C54,94 53,110 45,120 Z" fill="#15803D" transform="rotate(-44 45 120)"/>
        <path d="M45,120 C37,110 36,94 45,80 C54,94 53,110 45,120 Z" fill="#15803D" transform="rotate(44 45 120)"/>

        <!-- Hojas medias -->
        <path d="M45,120 C40,111 39,100 45,90 C51,100 50,111 45,120 Z" fill="#4ADE80" transform="rotate(-22 45 120)"/>
        <path d="M45,120 C40,111 39,100 45,90 C51,100 50,111 45,120 Z" fill="#4ADE80" transform="rotate(22 45 120)"/>

        <!-- Hojita central -->
        <path d="M45,120 C42,112 42,104 45,98 C48,104 48,112 45,120 Z" fill="#86EFAC"/>

        <!-- Brillos -->
        <ellipse cx="34" cy="98" rx="1.1" ry="3.5" fill="white" opacity="0.45" transform="rotate(-44 45 120)"/>
        <ellipse cx="56" cy="98" rx="1.1" ry="3.5" fill="white" opacity="0.45" transform="rotate(44 45 120)"/>
    </g>

    <!-- Maceta -->
    <rect x="30" y="118" width="30" height="5" rx="1.5" fill="#EA580C"/>
    <path d="M32,122 H58 L54,142 H36 Z" fill="#C2410C"/>
    <path d="M36,128 H54" stroke="#7C2D12" stroke-width="0.4" opacity="0.4"/>
</svg>
</body>
</html>
