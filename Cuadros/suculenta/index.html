<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suculenta Roseta</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #ECFDF5 0%, #D1FAE5 60%, #A7F3D0 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        .roseta {
            transform-box: view-box;
            transform-origin: 45px 120px;
            animation: balanceo 5s ease-in-out infinite;
        }
        .hoja-brillo {
            animation: brillo 3s ease-in-out infinite;
        }
        .hoja-brillo:nth-child(2n) { animation-duration: 3.8s; animation-delay: 0.7s; }

        @keyframes balanceo { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
        @keyframes brillo   { 0%,100% { opacity: 0.2; } 50% { opacity: 0.55; } }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="su-hoja" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#86EFAC"/>
            <stop offset="1" stop-color="#15803D"/>
        </linearGradient>
        <linearGradient id="su-pote" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FDBA74"/>
            <stop offset="1" stop-color="#C2410C"/>
        </linearGradient>
    </defs>

    <!-- Sombra en el piso -->
    <ellipse cx="45" cy="142" rx="22" ry="3" fill="#14532D" opacity="0.15"/>

    <g class="roseta">
        <!-- Hojas exteriores -->
        <g fill="url(#su-hoja)">
            <path d="M45,120 C36,110 34,92 45,78 C56,92 54,110 45,120 Z" transform="rotate(-70 45 120)"/>
            <path d="M45,120 C36,110 34,92 45,78 C56,92 54,110 45,120 Z" transform="rotate(70 45 120)"/>
            <path d="M45,120 C36,110 34,92 45,78 C56,92 54,110 45,120 Z" transform="rotate(-40 45 120)"/>
            <path d="M45,120 C36,110 34,92 45,78 C56,92 54,110 45,120 Z" transform="rotate(40 45 120)"/>
        </g>
        <!-- Hojas medias -->
        <g fill="#4ADE80">
            <path d="M45,120 C40,112 39,100 45,92 C51,100 50,112 45,120 Z" transform="rotate(-20 45 120)"/>
            <path d="M45,120 C40,112 39,100 45,92 C51,100 50,112 45,120 Z" transform="rotate(20 45 120)"/>
        </g>
        <!-- Hojita central -->
        <path d="M45,120 C42,112 42,104 45,98 C48,104 48,112 45,120 Z" fill="#86EFAC"/>

        <!-- Brillos sobre las hojas -->
        <g fill="white">
            <ellipse class="hoja-brillo" cx="30" cy="100" rx="1.2" ry="4" transform="rotate(-70 45 120)"/>
            <ellipse class="hoja-brillo" cx="60" cy="100" rx="1.2" ry="4" transform="rotate(70 45 120)"/>
            <ellipse class="hoja-brillo" cx="41" cy="96" rx="0.8" ry="2.5" transform="rotate(-20 45 120)"/>
        </g>

        <!-- Puntitos de textura -->
        <g fill="#14532D" opacity="0.3">
            <circle cx="40" cy="104" r="0.6"/>
            <circle cx="52" cy="106" r="0.6"/>
            <circle cx="46" cy="88" r="0.5"/>
        </g>
    </g>

    <!-- Maceta -->
    <rect x="30" y="118" width="30" height="5" rx="1.5" fill="#EA580C"/>
    <path d="M32,122 H58 L54,142 H36 Z" fill="url(#su-pote)"/>
    <path d="M36,126 H54" stroke="#7C2D12" stroke-width="0.4" opacity="0.4"/>
</svg>
</body>
</html>
