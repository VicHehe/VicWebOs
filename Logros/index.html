<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="lg-container">

        <div class="lg-progreso">
            <div class="lg-progreso-barra">
                <div class="lg-progreso-fill" id="lgProgresoFill"></div>
            </div>
            <span class="lg-progreso-texto" id="lgProgresoTexto">0% completado</span>
        </div>

        <main class="lg-main">
            <div class="lg-grid" id="lgGrid"></div>

            <div class="lg-empty" id="lgEmpty" hidden>
                <div class="lg-empty-icon">
                    <i data-lucide="trophy"></i>
                </div>
                <h3>Todavía no hay logros</h3>
                <p>Cuando agregues logros al sistema, aparecerán acá.</p>
            </div>
        </main>

    </div>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
