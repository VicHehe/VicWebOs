<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajedrez</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="aj-widget">

        <!-- TOPBAR -->
        <div class="aj-topbar">
            <i data-lucide="crown" class="aj-topbar-icono"></i>
            <span class="aj-topbar-titulo">Ajedrez</span>
            <span class="aj-status" id="ajStatus">
                <span class="aj-status-dot"></span>
                <span class="aj-status-txt">Tu turno</span>
            </span>
            <button class="aj-btn-icon" id="ajBtnReset" title="Nueva partida">
                <i data-lucide="rotate-ccw"></i>
            </button>
        </div>

        <!-- TABLERO -->
        <div class="aj-board-wrap">
            <div class="aj-board" id="ajBoard"></div>
            <div class="aj-overlay" id="ajOverlay" hidden></div>
        </div>

        <!-- FOOTER: recompensa / info -->
        <div class="aj-footer" id="ajFooter">
            <i data-lucide="coins"></i>
            <span id="ajFooterTxt">+250 al ganar</span>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
