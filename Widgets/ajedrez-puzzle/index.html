<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ajedrez Puzzle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="aj-widget">

        <!-- TOPBAR: título + rating + tema + reload en UNA línea -->
        <div class="aj-topbar">
            <i data-lucide="crown" class="aj-topbar-icono"></i>
            <span class="aj-topbar-titulo">Ajedrez</span>

            <span class="aj-chip" id="ajRating">
                <i data-lucide="star"></i>
                <span id="ajRatingTxt">—</span>
            </span>

            <span class="aj-chip aj-chip-themes" id="ajThemes">—</span>

            <button class="aj-btn-icon" id="ajBtnReload" title="Reintentar">
                <i data-lucide="refresh-cw"></i>
            </button>
        </div>

        <!-- TABLERO: se come TODO el espacio disponible -->
        <div class="aj-board-wrap">
            <div class="aj-board" id="ajBoard"></div>

            <div class="aj-overlay" id="ajOverlay">
                <div class="aj-spinner"></div>
                <span>Cargando…</span>
            </div>
        </div>

        <!-- BOTTOMBAR: status + intentos en UNA línea -->
        <div class="aj-bottombar">
            <div class="aj-status" id="ajStatus">
                <span class="aj-status-dot"></span>
                <span class="aj-status-txt">Preparando…</span>
            </div>
            <span class="aj-plays" id="ajPlays">—</span>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>lucide.createIcons();</script>
    <script src="script.js"></script>
</body>
</html>
