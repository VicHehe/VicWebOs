<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hormiguero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="hg-widget">

        <div class="hg-header">
            <div class="hg-titulo">
                <i data-lucide="bug"></i>
                <span>Hormiguero</span>
            </div>
            <div class="hg-clima" id="hgClima">
                <i data-lucide="sun"></i>
                <span>—</span>
            </div>
        </div>

        <div class="hg-stats">
            <span class="hg-stat">
                <i data-lucide="bug"></i>
                <span id="hgStatHormigas">2 / 5</span>
            </span>
            <span class="hg-stat">
                <i data-lucide="apple"></i>
                <span id="hgStatComida">5</span>
            </span>
            <span class="hg-stat">
                <i data-lucide="route"></i>
                <span id="hgStatTuneles">0 / 1</span>
            </span>
        </div>

        <div class="hg-canvas-wrap">
            <canvas id="hgCanvas"></canvas>
        </div>

        <div class="hg-acciones">
            <button class="hg-btn hg-btn-comida" id="hgBtnComida">
                <i data-lucide="apple"></i>
                <div>
                    <span class="hg-btn-nombre">Comida</span>
                    <span class="hg-btn-costo">
                        <i data-lucide="coins"></i> 15
                    </span>
                </div>
            </button>
            <button class="hg-btn hg-btn-tierra" id="hgBtnTierra">
                <i data-lucide="layers"></i>
                <div>
                    <span class="hg-btn-nombre">Tierra</span>
                    <span class="hg-btn-costo">
                        <i data-lucide="coins"></i> 40
                    </span>
                </div>
            </button>
            <button class="hg-btn hg-btn-mas" id="hgBtnMas">
                <i data-lucide="plus"></i>
                <div>
                    <span class="hg-btn-nombre">Más</span>
                </div>
            </button>
        </div>

    </div>

    <!-- MODAL: tienda completa -->
    <div class="hg-modal" id="hgModal" hidden>
        <div class="hg-modal-card">

            <div class="hg-modal-header">
                <h3>Tienda</h3>
                <button class="hg-modal-cerrar" id="hgModalCerrar"><i data-lucide="x"></i></button>
            </div>

            <div class="hg-modal-saldo">
                <i data-lucide="coins"></i>
                <span id="hgSaldo">0</span>
                <small>monedas disponibles</small>
            </div>

            <div class="hg-tienda-seccion">
                <h4><i data-lucide="wheat"></i> Alimento</h4>
                <div class="hg-tienda-grid">
                    <button class="hg-tienda-item" data-compra="comida10">
                        <i data-lucide="apple"></i>
                        <span class="hg-tienda-nombre">10 raciones</span>
                        <span class="hg-tienda-costo"><i data-lucide="coins"></i> 15</span>
                    </button>
                </div>
            </div>

            <div class="hg-tienda-seccion">
                <h4><i data-lucide="layers"></i> Expansión</h4>
                <div class="hg-tienda-grid">
                    <button class="hg-tienda-item" data-compra="tierra">
                        <i data-lucide="layers"></i>
                        <span class="hg-tienda-nombre">Ampliar tierra</span>
                        <span class="hg-tienda-desc">+1 espacio de túnel</span>
                        <span class="hg-tienda-costo"><i data-lucide="coins"></i> 40</span>
                    </button>
                    <button class="hg-tienda-item" data-compra="toldo">
                        <i data-lucide="home"></i>
                        <span class="hg-tienda-nombre">Toldo</span>
                        <span class="hg-tienda-desc">La lluvia afecta 50% menos</span>
                        <span class="hg-tienda-costo"><i data-lucide="coins"></i> 60</span>
                    </button>
                    <button class="hg-tienda-item" data-compra="comedero">
                        <i data-lucide="utensils"></i>
                        <span class="hg-tienda-nombre">Comedero pro</span>
                        <span class="hg-tienda-desc">×2 comida al salir</span>
                        <span class="hg-tienda-costo"><i data-lucide="coins"></i> 80</span>
                    </button>
                </div>
            </div>

            <div class="hg-tienda-seccion">
                <h4><i data-lucide="palette"></i> Decoración</h4>
                <div class="hg-tienda-grid">
                    <button class="hg-tienda-item" data-compra="hoja">
                        <i data-lucide="leaf"></i>
                        <span class="hg-tienda-nombre">Hoja</span>
                        <span class="hg-tienda-costo"><i data-lucide="coins"></i> 8</span>
                    </button>
                    <button class="hg-tienda-item" data-compra="piedrita">
                        <i data-lucide="circle"></i>
                        <span class="hg-tienda-nombre">Piedrita</span>
                        <span class="hg-tienda-costo"><i data-lucide="coins"></i> 5</span>
                    </button>
                    <button class="hg-tienda-item" data-compra="hongo">
                        <i data-lucide="mushroom"></i>
                        <span class="hg-tienda-nombre">Hongo</span>
                        <span class="hg-tienda-desc">Brilla de noche</span>
                        <span class="hg-tienda-costo"><i data-lucide="coins"></i> 20</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <div class="hg-toast" id="hgToast"></div>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
