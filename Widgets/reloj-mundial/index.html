<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Mundial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="rm-widget">
        <div class="rm-header">
            <div class="rm-titulo">
                <i data-lucide="globe-2"></i>
                <span>Reloj Mundial</span>
            </div>
            <button class="rm-add-btn" id="rmAddBtn" title="Añadir zona horaria">
                <i data-lucide="plus"></i>
            </button>
        </div>
        <div class="rm-lista" id="rmLista"></div>
    </div>

    <!-- Modal para añadir zona -->
    <div class="rm-modal" id="rmModal" hidden>
        <div class="rm-modal-card">
            <h3>Añadir zona horaria</h3>
            <p>Máximo 4 zonas.</p>
            <select id="rmZonaSelect"></select>
            <div class="rm-modal-btns">
                <button class="rm-btn rm-btn-cancel" id="rmCancelar">Cancelar</button>
                <button class="rm-btn rm-btn-ok" id="rmConfirmar">Añadir</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
