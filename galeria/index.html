<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Galería</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="gx-container">

        <!-- HEADER -->
        <header class="gx-header">
            <div class="gx-logo">
                <div class="gx-logo-mark">
                    <i data-lucide="images"></i>
                </div>
                <div class="gx-logo-text">
                    <h1>Galería</h1>
                    <p id="gxUserBadge">—</p>
                </div>
            </div>

            <button class="gx-btn-subir" id="btnSubir">
                <i data-lucide="upload"></i>
                <span>Subir imágenes</span>
            </button>
        </header>

        <!-- BARRA DE BÚSQUEDA + CARPETAS -->
        <div class="gx-controles">
            <div class="gx-buscador">
                <i data-lucide="search" class="gx-buscador-icono"></i>
                <input type="text" id="gxBuscador" placeholder="Buscar por nombre...">
                <button class="gx-buscador-clear" id="gxBuscadorClear" hidden title="Limpiar">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <button class="gx-btn-carpeta" id="btnNuevaCarpeta" title="Nueva carpeta">
                <i data-lucide="folder-plus"></i>
                <span>Nueva carpeta</span>
            </button>
        </div>

        <!-- SELECTOR DE CARPETAS -->
        <div class="gx-carpetas" id="gxCarpetas"></div>

        <!-- CONTADOR -->
        <div class="gx-contador" id="gxContador"></div>

        <!-- GRID -->
        <div class="gx-grid" id="gxGrid"></div>

        <!-- EMPTY -->
        <div class="gx-empty" id="gxEmpty" hidden>
            <i data-lucide="image-off"></i>
            <h3 id="gxEmptyTitulo">Aún no tienes imágenes</h3>
            <p id="gxEmptyDesc">Pulsa "Subir imágenes" para empezar.</p>
        </div>

        <!-- PAGINACIÓN -->
        <footer class="gx-footer" id="gxFooter" hidden>
            <div class="gx-paginacion">
                <button class="gx-page-btn" id="btnPrev" title="Anterior">
                    <i data-lucide="chevron-left"></i>
                </button>
                <span class="gx-page-info" id="gxPageInfo">1 / 1</span>
                <button class="gx-page-btn" id="btnNext" title="Siguiente">
                    <i data-lucide="chevron-right"></i>
                </button>
            </div>
            <div class="gx-tamano" id="gxTamanoTotal"></div>
        </footer>

    </div>

    <!-- INPUT OCULTO PARA SUBIR -->
    <input type="file" id="inputImagenes" accept="image/*" multiple hidden>

    <!-- MODAL: VISTA PREVIA DE IMAGEN -->
    <div class="gx-modal" id="modalPreview" hidden>
        <div class="gx-modal-card gx-modal-card-grande">
            <div class="gx-modal-header">
                <h2>
                    <i data-lucide="image"></i>
                    <span id="previewTitulo">Imagen</span>
                </h2>
                <button class="gx-modal-cerrar" id="previewCerrar">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <div class="gx-preview-body">
                <div class="gx-preview-img-wrap">
                    <img id="previewImg" alt="">
                </div>

                <div class="gx-preview-info">
                    <div class="gx-preview-meta">
                        <div class="gx-preview-meta-fila">
                            <span class="gx-preview-meta-label">Nombre</span>
                            <span class="gx-preview-meta-valor" id="previewNombre">—</span>
                        </div>
                        <div class="gx-preview-meta-fila">
                            <span class="gx-preview-meta-label">Carpeta</span>
                            <span class="gx-preview-meta-valor" id="previewCarpeta">—</span>
                        </div>
                        <div class="gx-preview-meta-fila">
                            <span class="gx-preview-meta-label">Tamaño</span>
                            <span class="gx-preview-meta-valor" id="previewTamano">—</span>
                        </div>
                        <div class="gx-preview-meta-fila">
                            <span class="gx-preview-meta-label">Subida</span>
                            <span class="gx-preview-meta-valor" id="previewFecha">—</span>
                        </div>
                    </div>

                    <div class="gx-preview-acciones">
                        <button class="gx-btn-accion" id="btnRenombrar">
                            <i data-lucide="pencil"></i>
                            Renombrar
                        </button>
                        <button class="gx-btn-accion" id="btnMover">
                            <i data-lucide="folder-input"></i>
                            Mover
                        </button>
                        <button class="gx-btn-accion gx-btn-peligro" id="btnEliminar">
                            <i data-lucide="trash-2"></i>
                            Eliminar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: NUEVA CARPETA -->
    <div class="gx-modal" id="modalCarpeta" hidden>
        <div class="gx-modal-card">
            <div class="gx-modal-header">
                <h2>
                    <i data-lucide="folder-plus"></i>
                    Nueva carpeta
                </h2>
                <button class="gx-modal-cerrar" id="carpetaCerrar">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="gx-modal-body">
                <div class="gx-field">
                    <label>Nombre</label>
                    <input type="text" id="carpetaNombre" placeholder="Ej: Vacaciones" maxlength="40">
                </div>
                <button class="gx-btn-primario" id="btnCrearCarpeta">
                    <i data-lucide="check"></i>
                    Crear
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: RENOMBRAR -->
    <div class="gx-modal" id="modalRenombrar" hidden>
        <div class="gx-modal-card">
            <div class="gx-modal-header">
                <h2>
                    <i data-lucide="pencil"></i>
                    Renombrar
                </h2>
                <button class="gx-modal-cerrar" id="renombrarCerrar">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="gx-modal-body">
                <div class="gx-field">
                    <label>Nuevo nombre</label>
                    <input type="text" id="renombrarNombre" placeholder="Nombre" maxlength="60">
                </div>
                <button class="gx-btn-primario" id="btnGuardarNombre">
                    <i data-lucide="check"></i>
                    Guardar
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: MOVER A CARPETA -->
    <div class="gx-modal" id="modalMover" hidden>
        <div class="gx-modal-card">
            <div class="gx-modal-header">
                <h2>
                    <i data-lucide="folder-input"></i>
                    Mover a carpeta
                </h2>
                <button class="gx-modal-cerrar" id="moverCerrar">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="gx-modal-body">
                <div class="gx-mover-lista" id="moverLista"></div>
            </div>
        </div>
    </div>

    <!-- OVERLAY DE SUBIDA -->
    <div class="gx-overlay-subida" id="overlaySubida" hidden>
        <div class="gx-overlay-subida-card">
            <div class="gx-spinner"></div>
            <p id="overlaySubidaTexto">Subiendo imágenes...</p>
            <div class="gx-progreso-barra">
                <div class="gx-progreso-fill" id="overlayProgresoFill"></div>
            </div>
            <span class="gx-progreso-texto" id="overlayProgresoTexto">0 / 0</span>
        </div>
    </div>

    <div class="gx-toast" id="gxToast"></div>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
