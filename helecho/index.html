<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helecho Arqueado</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #CCFBF1 0%, #E6FFFA 50%, #BBF7D0 100%);
        }
        svg { display: block; width: 100%; height: 100%; }

        /* Cada fronda se mece desde su base con ritmo distinto */
        .fronda {
            transform-box: view-box;
            transform-origin: 45px 140px;
            animation: mecer 4s ease-in-out infinite;
        }
        .fronda-1 { animation-duration: 3.4s; animation-delay: 0s; }
        .fronda-2 { animation-duration: 4.1s; animation-delay: 0.5s; }
        .fronda-3 { animation-duration: 3.8s; animation-delay: 1s; }
        .fronda-4 { animation-duration: 4.4s; animation-delay: 0.3s; }
        .fronda-5 { animation-duration: 3.6s; animation-delay: 0.8s; }

        .nube { animation: nube 22s linear infinite; }

        @keyframes mecer {
            0%,100% { transform: rotate(-2.5deg); }
            50%     { transform: rotate(2.5deg); }
        }
        @keyframes nube {
            from { transform: translateX(0); }
            to   { transform: translateX(-30px); }
        }
    </style>
</head>
<body>
<svg viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="he-hoja" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4ADE80"/>
            <stop offset="1" stop-color="#15803D"/>
        </linearGradient>
        <linearGradient id="he-maceta" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FB923C"/>
            <stop offset="1" stop-color="#9A3412"/>
        </linearGradient>
    </defs>

    <!-- Nube de fondo -->
    <g class="nube" fill="white" opacity="0.8">
        <ellipse cx="20" cy="24" rx="10" ry="3"/>
        <ellipse cx="16" cy="22" rx="5" ry="2.5"/>
        <ellipse cx="66" cy="34" rx="8" ry="2.5"/>
    </g>

    <!-- Sombra en el piso -->
    <ellipse cx="45" cy="156" rx="20" ry="2.5" fill="#134E4A" opacity="0.15"/>

    <!-- Frondas: cada una es un grupo que se mece desde la base (45,140).
         Dentro, un grupo rotado define la dirección de la fronda. -->

    <!-- Fronda 1: izquierda exterior -->
    <g class="fronda fronda-1">
        <g transform="rotate(-62 45 140)">
            <path d="M45,140 L45,64" stroke="#166534" stroke-width="0.8" fill="none" stroke-linecap="round"/>
            <g fill="url(#he-hoja)">
                <ellipse cx="41" cy="132" rx="4" ry="1.4"/><ellipse cx="49" cy="132" rx="4" ry="1.4"/>
                <ellipse cx="41" cy="124" rx="4.2" ry="1.4"/><ellipse cx="49" cy="124" rx="4.2" ry="1.4"/>
                <ellipse cx="41" cy="116" rx="4.2" ry="1.4"/><ellipse cx="49" cy="116" rx="4.2" ry="1.4"/>
                <ellipse cx="41" cy="108" rx="4" ry="1.4"/><ellipse cx="49" cy="108" rx="4" ry="1.4"/>
                <ellipse cx="41" cy="100" rx="3.6" ry="1.3"/><ellipse cx="49" cy="100" rx="3.6" ry="1.3"/>
                <ellipse cx="41" cy="92" rx="3" ry="1.2"/><ellipse cx="49" cy="92" rx="3" ry="1.2"/>
                <ellipse cx="41" cy="84" rx="2.4" ry="1"/><ellipse cx="49" cy="84" rx="2.4" ry="1"/>
                <ellipse cx="45" cy="70" rx="1.4" ry="2.5"/>
            </g>
        </g>
    </g>

    <!-- Fronda 2: derecha exterior -->
    <g class="fronda fronda-2">
        <g transform="rotate(62 45 140)">
            <path d="M45,140 L45,64" stroke="#166534" stroke-width="0.8" fill="none" stroke-linecap="round"/>
            <g fill="#22C55E">
                <ellipse cx="41" cy="132" rx="4" ry="1.4"/><ellipse cx="49" cy="132" rx="4" ry="1.4"/>
                <ellipse cx="41" cy="124" rx="4.2" ry="1.4"/><ellipse cx="49" cy="124" rx="4.2" ry="1.4"/>
                <ellipse cx="41" cy="116" rx="4.2" ry="1.4"/><ellipse cx="49" cy="116" rx="4.2" ry="1.4"/>
                <ellipse cx="41" cy="108" rx="4" ry="1.4"/><ellipse cx="49" cy="108" rx="4" ry="1.4"/>
                <ellipse cx="41" cy="100" rx="3.6" ry="1.3"/><ellipse cx="49" cy="100" rx="3.6" ry="1.3"/>
                <ellipse cx="41" cy="92" rx="3" ry="1.2"/><ellipse cx="49" cy="92" rx="3" ry="1.2"/>
                <ellipse cx="41" cy="84" rx="2.4" ry="1"/><ellipse cx="49" cy="84" rx="2.4" ry="1"/>
                <ellipse cx="45" cy="70" rx="1.4" ry="2.5"/>
            </g>
        </g>
    </g>

    <!-- Fronda 3: centro alta -->
    <g class="fronda fronda-3">
        <g transform="rotate(-18 45 140)">
            <path d="M45,140 L45,46" stroke="#166534" stroke-width="0.9" fill="none" stroke-linecap="round"/>
            <g fill="#16A34A">
                <ellipse cx="41" cy="128" rx="4.6" ry="1.5"/><ellipse cx="49" cy="128" rx="4.6" ry="1.5"/>
                <ellipse cx="41" cy="118" rx="4.8" ry="1.5"/><ellipse cx="49" cy="118" rx="4.8" ry="1.5"/>
                <ellipse cx="41" cy="108" rx="4.6" ry="1.5"/><ellipse cx="49" cy="108" rx="4.6" ry="1.5"/>
                <ellipse cx="41" cy="98" rx="4.2" ry="1.4"/><ellipse cx="49" cy="98" rx="4.2" ry="1.4"/>
                <ellipse cx="41" cy="88" rx="3.6" ry="1.3"/><ellipse cx="49" cy="88" rx="3.6" ry="1.3"/>
                <ellipse cx="41" cy="78" rx="2.8" ry="1.1"/><ellipse cx="49" cy="78" rx="2.8" ry="1.1"/>
                <ellipse cx="41" cy="68" rx="2" ry="0.9"/><ellipse cx="49" cy="68" rx="2" ry="0.9"/>
                <ellipse cx="45" cy="54" rx="1.2" ry="2.2"/>
            </g>
        </g>
    </g>

    <!-- Fronda 4: izquierda interior -->
    <g class="fronda fronda-4">
        <g transform="rotate(-34 45 140)">
            <path d="M45,140 L45,76" stroke="#15803D" stroke-width="0.7" fill="none" stroke-linecap="round"/>
            <g fill="#4ADE80">
                <ellipse cx="41" cy="132" rx="3.6" ry="1.3"/><ellipse cx="49" cy="132" rx="3.6" ry="1.3"/>
                <ellipse cx="41" cy="122" rx="3.8" ry="1.3"/><ellipse cx="49" cy="122" rx="3.8" ry="1.3"/>
                <ellipse cx="41" cy="112" rx="3.6" ry="1.3"/><ellipse cx="49" cy="112" rx="3.6" ry="1.3"/>
                <ellipse cx="41" cy="102" rx="3.2" ry="1.2"/><ellipse cx="49" cy="102" rx="3.2" ry="1.2"/>
                <ellipse cx="41" cy="92" rx="2.6" ry="1.1"/><ellipse cx="49" cy="92" rx="2.6" ry="1.1"/>
                <ellipse cx="45" cy="80" rx="1.2" ry="2"/>
            </g>
        </g>
    </g>

    <!-- Fronda 5: derecha interior -->
    <g class="fronda fronda-5">
        <g transform="rotate(34 45 140)">
            <path d="M45,140 L45,76" stroke="#15803D" stroke-width="0.7" fill="none" stroke-linecap="round"/>
            <g fill="#4ADE80">
                <ellipse cx="41" cy="132" rx="3.6" ry="1.3"/><ellipse cx="49" cy="132" rx="3.6" ry="1.3"/>
                <ellipse cx="41" cy="122" rx="3.8" ry="1.3"/><ellipse cx="49" cy="122" rx="3.8" ry="1.3"/>
                <ellipse cx="41" cy="112" rx="3.6" ry="1.3"/><ellipse cx="49" cy="112" rx="3.6" ry="1.3"/>
                <ellipse cx="41" cy="102" rx="3.2" ry="1.2"/><ellipse cx="49" cy="102" rx="3.2" ry="1.2"/>
                <ellipse cx="41" cy="92" rx="2.6" ry="1.1"/><ellipse cx="49" cy="92" rx="2.6" ry="1.1"/>
                <ellipse cx="45" cy="80" rx="1.2" ry="2"/>
            </g>
        </g>
    </g>

    <!-- Maceta -->
    <path d="M32,138 H58 L55,156 H35 Z" fill="url(#he-maceta)"/>
    <rect x="30" y="135" width="30" height="5" rx="1.5" fill="#C2410C"/>
    <path d="M37,144 H53" stroke="#7C2D12" stroke-width="0.4" opacity="0.4"/>
</svg>
</body>
</html>
