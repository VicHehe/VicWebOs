<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mezosoic Run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="dn-container">

        <header class="dn-header">
            <div class="dn-logo">
                <div class="dn-logo-mark">
                    <i data-lucide="gamepad-2"></i>
                </div>
                <div class="dn-logo-text">
                    <h1>Mezosoic Run</h1>
                    <p id="dnUserBadge">—</p>
                </div>
            </div>

            <div class="dn-record">
                <span class="dn-record-label">Récord</span>
                <span class="dn-record-valor" id="dnRecordValor">0</span>
            </div>
        </header>

        <div class="dn-hud">
            <div class="dn-hud-puntos">
                <span class="dn-hud-label">Puntos</span>
                <span class="dn-hud-valor" id="dnPuntos">0</span>
            </div>
            <div class="dn-hud-monedas">
                <i data-lucide="coins" class="dn-hud-icono"></i>
                <span class="dn-hud-valor" id="dnMonedasPartida">0</span>
                <span class="dn-hud-label">esta partida</span>
            </div>
        </div>

        <div class="dn-canvas-wrapper">
            <canvas id="dnCanvas" width="900" height="260"></canvas>
        </div>

        <div class="dn-progreso">
            <div class="dn-progreso-header">
                <span class="dn-progreso-label">
                    <i data-lucide="sparkles"></i>
                    Próximo bonus en 5.000 pts
                </span>
                <span class="dn-progreso-meta" id="dnProgresoMeta">0 / 5000</span>
            </div>
            <div class="dn-progreso-barra">
                <div class="dn-progreso-fill" id="dnProgresoFill" style="width:0%"></div>
                <div class="dn-progreso-marcas" id="dnProgresoMarcas"></div>
            </div>
            <div class="dn-progreso-info">
                500 pts = <strong>5 monedas</strong> · 5.000 pts = <strong>+25 extra</strong>
            </div>
        </div>

    </div>

    <!-- ============================================================
         OVERLAYS — Modales que cubren TODA la app.
         Viven fuera del canvas-wrapper para no aplastarse contra
         los bordes del canvas.
         ============================================================ -->

    <div class="dn-overlay" id="dnOverlayStart">
        <div class="dn-overlay-card">
            <div class="dn-overlay-icono">
                <i data-lucide="play"></i>
            </div>
            <h2>¿Listo para correr?</h2>
            <p>Toca la pantalla o pulsa <kbd>Espacio</kbd> para saltar. Esquiva los cactus.</p>
            <button class="dn-btn-primario" id="dnBtnEmpezar">
                <i data-lucide="play"></i>
                Empezar
            </button>
        </div>
    </div>

    <div class="dn-overlay" id="dnOverlayGameOver" hidden>
        <div class="dn-overlay-card">
            <div class="dn-overlay-icono dn-overlay-icono-error">
                <i data-lucide="zap-off"></i>
            </div>
            <h2>¡Chocaste!</h2>
            <div class="dn-go-resumen">
                <div class="dn-go-fila">
                    <span class="dn-go-label">Puntos</span>
                    <span class="dn-go-valor" id="dnGoPuntos">0</span>
                </div>
                <div class="dn-go-fila dn-go-destacada">
                    <span class="dn-go-label">
                        <i data-lucide="coins"></i>
                        Monedas ganadas
                    </span>
                    <span class="dn-go-valor dn-go-monedas" id="dnGoMonedas">+0</span>
                </div>
                <div class="dn-go-fila" id="dnGoRecordFila" hidden>
                    <span class="dn-go-label">
                        <i data-lucide="trophy"></i>
                        ¡Nuevo récord!
                    </span>
                    <span class="dn-go-valor" id="dnGoRecord">0</span>
                </div>
            </div>
            <button class="dn-btn-primario" id="dnBtnReintentar">
                <i data-lucide="rotate-ccw"></i>
                Reintentar
            </button>
        </div>
    </div>

    <div class="dn-toast" id="dnToast"></div>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
