<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Encuestas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="en-app">
        <div class="en-container">

            <!-- HEADER -->
            <header class="en-header">
                <div class="en-logo">
                    <div class="en-logo-mark"><i data-lucide="vote"></i></div>
                    <div class="en-logo-text">
                        <h1>Encuestas</h1>
                        <p id="enUserBadge">—</p>
                    </div>
                </div>

                <div class="en-header-actions">
                    <button class="en-btn-icon" id="enBtnTop" title="Más votadas por categoría">
                        <i data-lucide="trophy"></i>
                    </button>
                    <button class="en-btn-nueva" id="enBtnNueva">
                        <i data-lucide="plus"></i>
                        <span>Nueva encuesta</span>
                    </button>
                </div>
            </header>

            <!-- TOOLBAR -->
            <div class="en-toolbar">
                <div class="en-toolbar-grupo">
                    <span class="en-toolbar-label">Categoría</span>
                    <div class="en-chips" id="enFiltroCategoria">
                        <button class="en-chip active" data-cat="todas">
                            <i data-lucide="layout-grid"></i>
                            <span>Todas</span>
                        </button>
                        <button class="en-chip" data-cat="tonteria">
                            <i data-lucide="party-popper"></i>
                            <span>Tontería</span>
                        </button>
                        <button class="en-chip" data-cat="serio">
                            <i data-lucide="scale"></i>
                            <span>Serio</span>
                        </button>
                        <button class="en-chip" data-cat="economico">
                            <i data-lucide="coins"></i>
                            <span>Económico</span>
                        </button>
                    </div>
                </div>
                <div class="en-toolbar-grupo">
                    <span class="en-toolbar-label">Estado</span>
                    <div class="en-chips" id="enFiltroEstado">
                        <button class="en-chip active" data-estado="abiertas">
                            <i data-lucide="circle-dot"></i>
                            <span>Abiertas</span>
                        </button>
                        <button class="en-chip" data-estado="cerradas">
                            <i data-lucide="lock"></i>
                            <span>Cerradas</span>
                        </button>
                        <button class="en-chip" data-estado="todas">
                            <i data-lucide="layers"></i>
                            <span>Todas</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- MAIN -->
            <main class="en-main">
                <div class="en-feed" id="enFeed"></div>

                <div class="en-empty" id="enEmpty" hidden>
                    <div class="en-empty-icon"><i data-lucide="vote"></i></div>
                    <h3 id="enEmptyTitulo">No hay encuestas</h3>
                    <p id="enEmptyDesc">Creá la primera encuesta y dejá que la comunidad opine.</p>
                    <button class="en-empty-btn" id="enEmptyBtnNuevo">
                        <i data-lucide="plus"></i>
                        Crear encuesta
                    </button>
                </div>
            </main>

        </div>

        <button class="en-fab" id="enFabNuevo" title="Nueva encuesta">
            <i data-lucide="plus"></i>
        </button>
    </div>

    <!-- ==================================================
         MODAL: CREAR
    =================================================== -->
    <div class="en-modal" id="enModalCrear" hidden>
        <div class="en-modal-card en-modal-card-grande">
            <div class="en-modal-header">
                <h2>
                    <i data-lucide="vote"></i>
                    <span id="enCrearTitulo">Nueva encuesta</span>
                </h2>
                <button class="en-modal-cerrar" id="enCrearCerrar"><i data-lucide="x"></i></button>
            </div>

            <div class="en-modal-body">
                <div class="en-field">
                    <label>Pregunta</label>
                    <input type="text" id="enCrearPregunta" maxlength="140"
                           placeholder="¿Qué querés preguntar?" autocomplete="off">
                </div>

                <div class="en-field">
                    <label>Categoría</label>
                    <div class="en-cat-picker">
                        <button class="en-cat-opcion" data-cat="tonteria">
                            <i data-lucide="party-popper"></i>
                            <span>Tontería</span>
                        </button>
                        <button class="en-cat-opcion" data-cat="serio">
                            <i data-lucide="scale"></i>
                            <span>Serio</span>
                        </button>
                        <button class="en-cat-opcion" data-cat="economico">
                            <i data-lucide="coins"></i>
                            <span>Económico</span>
                        </button>
                    </div>
                </div>

                <div class="en-field">
                    <div class="en-field-label-row">
                        <label>Opciones</label>
                        <span class="en-field-hint" id="enCrearOpcionesHint">2 / 6</span>
                    </div>
                    <div class="en-opciones-lista" id="enCrearOpciones"></div>
                    <button class="en-btn-add-opcion" id="enCrearAddOpcion">
                        <i data-lucide="plus"></i>
                        Añadir opción
                    </button>
                </div>

                <div class="en-field">
                    <label>¿Cómo se vota?</label>
                    <div class="en-toggle-grupo">
                        <button class="en-toggle active" data-toggle="voto-unico">
                            <i data-lucide="circle-dot"></i>
                            <div>
                                <strong>Único</strong>
                                <span>1 opción por persona</span>
                            </div>
                        </button>
                        <button class="en-toggle" data-toggle="voto-multiple">
                            <i data-lucide="check-square"></i>
                            <div>
                                <strong>Múltiple</strong>
                                <span>Puede elegir varias</span>
                            </div>
                        </button>
                    </div>
                </div>

                <div class="en-field">
                    <label>Visibilidad de votos</label>
                    <div class="en-toggle-grupo">
                        <button class="en-toggle active" data-toggle="publico">
                            <i data-lucide="eye"></i>
                            <div>
                                <strong>Público</strong>
                                <span>Se ve quién votó qué</span>
                            </div>
                        </button>
                        <button class="en-toggle" data-toggle="privado">
                            <i data-lucide="eye-off"></i>
                            <div>
                                <strong>Privado</strong>
                                <span>Solo se ve el total</span>
                            </div>
                        </button>
                    </div>
                </div>

                <div class="en-field" id="enFieldJustificacion" hidden>
                    <label class="en-checkbox-label" id="enJustifLabel">
                        <input type="checkbox" id="enCrearJustifOblig">
                        <span class="en-checkbox-box"><i data-lucide="check"></i></span>
                        <span class="en-checkbox-texto">
                            <strong>Pedir justificación obligatoria</strong>
                            <span>Cada voto debe explicar por qué eligió esa opción.</span>
                        </span>
                    </label>
                </div>

                <div class="en-field">
                    <label>¿Quién puede votar?</label>
                    <div class="en-toggle-grupo">
                        <button class="en-toggle active" data-toggle="todos">
                            <i data-lucide="users"></i>
                            <div>
                                <strong>Todos</strong>
                                <span>Toda la comunidad</span>
                            </div>
                        </button>
                        <button class="en-toggle" data-toggle="invitados">
                            <i data-lucide="user-check"></i>
                            <div>
                                <strong>Invitados</strong>
                                <span>Solo quienes elijas</span>
                            </div>
                        </button>
                    </div>
                    <button class="en-btn-invitados" id="enCrearElegirInvitados" hidden>
                        <i data-lucide="users"></i>
                        <span id="enCrearInvitadosTxt">Elegir invitados</span>
                    </button>
                </div>

                <div class="en-field">
                    <label class="en-checkbox-label" id="enCierreLabel">
                        <input type="checkbox" id="enCrearCierreActivo">
                        <span class="en-checkbox-box"><i data-lucide="check"></i></span>
                        <span class="en-checkbox-texto">
                            <strong>Fecha de cierre automático</strong>
                            <span>La encuesta se cierra sola al llegar esa fecha.</span>
                        </span>
                    </label>
                    <input type="datetime-local" id="enCrearCierreFecha" hidden>
                </div>

                <div id="enCrearMensaje" class="en-modal-mensaje"></div>
            </div>

            <div class="en-modal-actions">
                <button class="en-btn-sec" id="enCrearCancelar">Cancelar</button>
                <button class="en-btn-pri" id="enCrearGuardar">
                    <i data-lucide="check"></i>
                    <span>Publicar encuesta</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ==================================================
         MODAL: INVITADOS
    =================================================== -->
    <div class="en-modal en-modal-sub" id="enModalInvitados" hidden>
        <div class="en-modal-card">
            <div class="en-modal-header">
                <h2><i data-lucide="user-check"></i><span>Elegir invitados</span></h2>
                <button class="en-modal-cerrar" id="enInvitadosCerrar"><i data-lucide="x"></i></button>
            </div>
            <div class="en-modal-body">
                <div class="en-field">
                    <input type="text" id="enInvitadosBuscar" placeholder="Buscar por nombre o código..." autocomplete="off">
                </div>
                <div class="en-invitados-lista" id="enInvitadosLista"></div>
            </div>
            <div class="en-modal-actions">
                <span class="en-invitados-contador" id="enInvitadosContador">0 seleccionados</span>
                <button class="en-btn-pri" id="enInvitadosListo">
                    <i data-lucide="check"></i>
                    <span>Listo</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ==================================================
         MODAL: VER DETALLE
    =================================================== -->
    <div class="en-modal" id="enModalVer" hidden>
        <div class="en-modal-card en-modal-card-grande">
            <div class="en-modal-header">
                <h2><i data-lucide="bar-chart-3"></i><span>Detalle</span></h2>
                <button class="en-modal-cerrar" id="enVerCerrar"><i data-lucide="x"></i></button>
            </div>
            <div class="en-ver-body" id="enVerBody"></div>
        </div>
    </div>

    <!-- ==================================================
         MODAL: RANKING
    =================================================== -->
    <div class="en-modal" id="enModalTop" hidden>
        <div class="en-modal-card en-modal-card-grande">
            <div class="en-modal-header">
                <h2><i data-lucide="trophy"></i><span>Más votadas</span></h2>
                <button class="en-modal-cerrar" id="enTopCerrar"><i data-lucide="x"></i></button>
            </div>
            <div class="en-modal-body">
                <div class="en-top-tabs">
                    <button class="en-top-tab active" data-cat="tonteria">
                        <i data-lucide="party-popper"></i><span>Tontería</span>
                    </button>
                    <button class="en-top-tab" data-cat="serio">
                        <i data-lucide="scale"></i><span>Serio</span>
                    </button>
                    <button class="en-top-tab" data-cat="economico">
                        <i data-lucide="coins"></i><span>Económico</span>
                    </button>
                </div>
                <div class="en-top-lista" id="enTopLista"></div>
            </div>
        </div>
    </div>

    <div class="en-toast" id="enToast"></div>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
