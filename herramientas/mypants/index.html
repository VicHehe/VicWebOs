<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MyPants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="mp-container">
        <!-- HEADER FLOTANTE -->
        <header class="mp-header">
            <div class="mp-logo">
                <i data-lucide="smartphone"></i>
                <h1>MyPants</h1>
            </div>
            <div class="mp-header-actions">
                <button class="mp-icon-btn" id="mpBtnPerfil" title="Mi Perfil">
                    <i data-lucide="user"></i>
                </button>
                <button class="mp-icon-btn mp-btn-nuevo" id="mpBtnNuevo" title="Subir Pantalón">
                    <i data-lucide="plus"></i>
                </button>
            </div>
        </header>

        <!-- FEED TIKTOK STYLE -->
        <main class="mp-feed" id="mpFeed"></main>
        
        <div class="mp-empty" id="mpEmpty" hidden>
            <i data-lucide="video-off"></i>
            <h3>No hay pantalones subidos</h3>
            <p>Sube el primer clip de 2MB a la comunidad.</p>
            <button class="mp-btn-primario" id="mpEmptyBtn">Subir video</button>
        </div>
    </div>

    <!-- MODAL SUBIR VIDEO -->
    <div class="mp-modal" id="mpModalSubir" hidden>
        <div class="mp-modal-card">
            <div class="mp-modal-header">
                <h2><i data-lucide="upload"></i> Nuevo Pantalón</h2>
                <button class="mp-modal-cerrar" id="mpSubirCerrar"><i data-lucide="x"></i></button>
            </div>
            <div class="mp-modal-body">
                <div class="mp-alerta" id="mpAlertaLimite" hidden>
                    <i data-lucide="alert-triangle"></i>
                    <span>Has alcanzado el límite de 25 videos. Borra uno desde tu perfil para subir nuevos.</span>
                </div>
                
                <div id="mpFormSubir">
                    <label class="mp-file-drop" id="mpFileDrop">
                        <i data-lucide="video"></i>
                        <span>Elige un video (Máx 2MB)</span>
                        <input type="file" id="mpInputFile" accept="video/mp4,video/x-m4v,video/*" hidden>
                    </label>
                    
                    <div class="mp-preview-wrap" id="mpPreviewWrap" hidden>
                        <video id="mpVideoPreview" controls playsinline muted></video>
                        <button class="mp-btn-secundario" id="mpBtnCambiarVideo" style="width: 100%; margin-top: 8px;">
                            <i data-lucide="refresh-cw"></i> Cambiar archivo
                        </button>
                    </div>

                    <div class="mp-campo">
                        <label>Descripción</label>
                        <input type="text" id="mpInputDesc" maxlength="60" placeholder="¿De qué trata este clip?">
                    </div>
                </div>
            </div>
            <div class="mp-modal-actions" id="mpSubirActions">
                <button class="mp-btn-secundario" id="mpSubirCancelar">Cancelar</button>
                <button class="mp-btn-primario" id="mpSubirGuardar" disabled>
                    <i data-lucide="upload-cloud"></i> Subir
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL COMENTARIOS -->
    <div class="mp-modal mp-modal-bottom" id="mpModalComentarios" hidden>
        <div class="mp-modal-card mp-card-comentarios">
            <div class="mp-modal-header">
                <h2><i data-lucide="message-circle"></i> Comentarios</h2>
                <button class="mp-modal-cerrar" id="mpComCerrar"><i data-lucide="x"></i></button>
            </div>
            <div class="mp-comentarios-lista" id="mpComLista"></div>
            <div class="mp-comentarios-input">
                <input type="text" id="mpInputComentario" maxlength="150" placeholder="Escribe un comentario...">
                <button class="mp-btn-enviar" id="mpBtnEnviarCom">
                    <i data-lucide="send"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL PERFIL (GESTIÓN) -->
    <div class="mp-modal" id="mpModalPerfil" hidden>
        <div class="mp-modal-card mp-card-perfil">
            <div class="mp-modal-header">
                <h2><i data-lucide="user"></i> Mi Armario (Perfil)</h2>
                <button class="mp-modal-cerrar" id="mpPerfilCerrar"><i data-lucide="x"></i></button>
            </div>
            <div class="mp-perfil-stats">
                <span id="mpPerfilConteo">0 / 25 videos subidos</span>
            </div>
            <div class="mp-perfil-grid" id="mpPerfilGrid"></div>
        </div>
    </div>

    <div class="mp-toast" id="mpToast"></div>

    <script src="script.js"></script>
</body>
</html>
