<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Primero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="pm-app">

    <!-- ============ HEADER (visible en las 3 pantallas) ============ -->
    <header class="pm-header">
        <div class="pm-logo">
            <div class="pm-logo-mark"><i data-lucide="layers"></i></div>
            <div class="pm-logo-text">
                <h1>Primero</h1>
                <p id="pmUserBadge">—</p>
            </div>
        </div>
        <div class="pm-header-actions">
            <div class="pm-room-badge" id="roomBadge" hidden></div>
            <div class="pm-color-indicator" id="colorIndicator" data-color="red"></div>
            <button class="pm-icon-btn pm-btn-exit" id="btnExit" title="Salir de la partida">
                <i data-lucide="x"></i>
            </button>
        </div>
    </header>

    <!-- ============ CUERPO ============ -->
    <main class="pm-main">

        <!-- LOBBY -->
        <div class="screen active" id="screenLobby">
            <div class="pm-screen-content pm-screen-center">
                <div class="pm-card">
                    <h2>Elegí cómo querés jugar</h2>
                    <p class="pm-card-desc">Vacía tu mano antes que el rival. Combiná color o valor.</p>

                    <button class="pm-mode-card" data-mode="real">
                        <div class="pm-mode-icon pm-mode-icon-you"><i data-lucide="users"></i></div>
                        <div class="pm-mode-info">
                            <strong>Contra un amigo</strong>
                            <small>1 vs 1 · Sincronizado en vivo</small>
                        </div>
                        <div class="pm-mode-reward"><i data-lucide="coins"></i><span>+30</span></div>
                    </button>

                    <button class="pm-mode-card" data-mode="cpu">
                        <div class="pm-mode-icon pm-mode-icon-cpu"><i data-lucide="cpu"></i></div>
                        <div class="pm-mode-info">
                            <strong>Contra la CPU</strong>
                            <small>IA simple · Sin conexión</small>
                        </div>
                        <div class="pm-mode-reward"><i data-lucide="coins"></i><span>+35</span></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- JOIN -->
        <div class="screen" id="screenJoin">
            <div class="pm-screen-content pm-screen-center">
                <div class="pm-card">
                    <button class="pm-back-btn" id="btnBack" aria-label="Volver">
                        <i data-lucide="arrow-left"></i>
                    </button>

                    <h2>Conectar con un amigo</h2>
                    <p class="pm-card-desc">Ambos escriben el mismo código</p>

                    <div class="pm-field">
                        <label for="roomInput">Código de sala</label>
                        <input type="text" id="roomInput" maxlength="20" autocomplete="off" spellcheck="false">
                    </div>

                    <div class="pm-field">
                        <label>Tu rol</label>
                        <div class="pm-role-grid">
                            <label class="pm-role-card">
                                <input type="radio" name="role" value="host" checked>
                                <span class="pm-role-inner">
                                    <i data-lucide="crown"></i>
                                    <strong>Crear</strong>
                                    <small>Esperar rival</small>
                                </span>
                            </label>
                            <label class="pm-role-card">
                                <input type="radio" name="role" value="guest">
                                <span class="pm-role-inner">
                                    <i data-lucide="log-in"></i>
                                    <strong>Unirme</strong>
                                    <small>A sala existente</small>
                                </span>
                            </label>
                        </div>
                    </div>

                    <button class="pm-btn-primary" id="btnConnect">
                        <i data-lucide="zap"></i><span>Conectar</span>
                    </button>
                    <div id="joinStatus" class="pm-status-msg"></div>
                </div>
            </div>
        </div>

        <!-- GAME -->
        <div class="screen" id="screenGame">
            <div class="pm-game-content">

                <div class="pm-opponent-bar">
                    <div class="pm-opp-info">
                        <div class="pm-opp-avatar"><i data-lucide="user"></i></div>
                        <span id="rivalName">Rival</span>
                    </div>
                    <div class="pm-opp-cards" id="oppCards">
                        <i data-lucide="layers"></i>
                        <span id="oppCount">7</span>
                    </div>
                </div>

                <div class="pm-table-area">
                    <button class="pm-deck-pile" id="deckPile">
                        <i data-lucide="layers"></i>
                        <span class="pm-deck-count" id="deckCount">0</span>
                    </button>
                    <div class="pm-discard-pile" id="discardPile"></div>
                </div>

                <div class="pm-status-bar" id="statusBar">
                    <i data-lucide="hand-pointer" id="statusIcon"></i>
                    <span id="statusText">Tu turno</span>
                </div>

                <div class="pm-hand-wrap">
                    <div class="pm-hand" id="myHand"></div>
                </div>

            </div>
        </div>

    </main>

</div>

<!-- MODAL: elegir color -->
<div class="pm-modal" id="modalColor" hidden>
    <div class="pm-modal-card pm-modal-sm">
        <h3>Elegí un color</h3>
        <div class="pm-color-options">
            <button class="color-opt" data-color="red"><i data-lucide="droplet"></i></button>
            <button class="color-opt" data-color="blue"><i data-lucide="droplet"></i></button>
            <button class="color-opt" data-color="green"><i data-lucide="droplet"></i></button>
            <button class="color-opt" data-color="yellow"><i data-lucide="droplet"></i></button>
        </div>
    </div>
</div>

<!-- MODAL: fin de partida -->
<div class="pm-modal" id="modalFin" hidden>
    <div class="pm-modal-card">
        <div class="pm-end-icon" id="endIcon"><i data-lucide="trophy"></i></div>
        <h2 id="endTitle">¡Ganaste!</h2>
        <p id="endSubtitle">Vaciaste tu mano primero.</p>
        <div class="pm-end-actions">
            <button class="pm-btn-sec" id="btnSalirMenu"><i data-lucide="home"></i><span>Menú</span></button>
            <button class="pm-btn-primary" id="btnRevancha"><i data-lucide="rotate-ccw"></i><span id="btnRevanchaText">Revancha</span></button>
        </div>
    </div>
</div>

<div class="pm-toast" id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script src="script.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
