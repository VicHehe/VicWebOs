<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Piedra Papel Tijera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="rps-app">

    <!-- ============ HEADER (visible en las 3 pantallas) ============ -->
    <header class="rps-header">
        <div class="rps-logo">
            <div class="rps-logo-mark"><i data-lucide="scissors"></i></div>
            <div class="rps-logo-text">
                <h1>Piedra, Papel o Tijera</h1>
                <p id="rpsUserBadge">—</p>
            </div>
        </div>
        <div class="rps-header-actions">
            <div class="rps-round-label" id="roundLabel">Ronda 1 de 3</div>
            <div class="rps-room-badge" id="roomBadge" hidden></div>
            <button class="rps-icon-btn" id="btnExit" title="Salir de la partida">
                <i data-lucide="x"></i>
            </button>
        </div>
    </header>

    <!-- ============ CUERPO ============ -->
    <main class="rps-main">

        <!-- LOBBY -->
        <div class="screen active" id="screenLobby">
            <div class="rps-screen-center">
                <div class="rps-card">
                    <h2>Elegí cómo querés jugar</h2>
                    <p class="rps-card-desc">Mejor de 3 contra un amigo, o 6 rondas contra la CPU.</p>

                    <button class="mode-card" data-mode="real">
                        <div class="mode-icon mode-icon-you"><i data-lucide="users"></i></div>
                        <div class="mode-info">
                            <strong>Contra un amigo</strong>
                            <small>Mejor de 3 · Primero en ganar 2</small>
                        </div>
                        <div class="mode-reward">
                            <i data-lucide="coins"></i>
                            <span>+2</span>
                        </div>
                    </button>

                    <button class="mode-card" data-mode="cpu">
                        <div class="mode-icon mode-icon-cpu"><i data-lucide="cpu"></i></div>
                        <div class="mode-info">
                            <strong>Contra la CPU</strong>
                            <small>6 rondas · Gratis</small>
                        </div>
                        <div class="mode-reward">
                            <i data-lucide="coins"></i>
                            <span>+4</span>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <!-- JOIN -->
        <div class="screen" id="screenJoin">
            <div class="rps-screen-center">
                <div class="rps-card">
                    <button class="rps-back-btn" id="btnBack" aria-label="Volver">
                        <i data-lucide="arrow-left"></i>
                    </button>

                    <h2>Conectar con un amigo</h2>
                    <p class="rps-card-desc">Ambos deben escribir el mismo código</p>

                    <div class="rps-field">
                        <label for="roomInput">Código de sala</label>
                        <input type="text" id="roomInput" maxlength="20" autocomplete="off" spellcheck="false">
                    </div>

                    <div class="rps-field">
                        <label>Tu rol</label>
                        <div class="role-grid">
                            <label class="role-card">
                                <input type="radio" name="role" value="host" checked>
                                <span class="role-inner">
                                    <i data-lucide="crown"></i>
                                    <strong>Crear</strong>
                                    <small>Esperar rival</small>
                                </span>
                            </label>
                            <label class="role-card">
                                <input type="radio" name="role" value="guest">
                                <span class="role-inner">
                                    <i data-lucide="log-in"></i>
                                    <strong>Unirme</strong>
                                    <small>A sala existente</small>
                                </span>
                            </label>
                        </div>
                    </div>

                    <button class="btn-primary" id="btnConnect">
                        <i data-lucide="zap"></i>
                        <span>Conectar</span>
                    </button>
                    <div id="joinStatus" class="status-msg"></div>
                </div>
            </div>
        </div>

        <!-- GAME -->
        <div class="screen" id="screenGame">
            <div class="rps-game-content">

                <div class="score-bar">
                    <div class="score-side score-you">
                        <span class="score-name">Tú</span>
                        <span class="score-value" id="myScore">0</span>
                    </div>
                    <div class="score-vs">
                        <span class="score-vs-line"></span>
                        <span class="score-vs-text">VS</span>
                        <span class="score-vs-line"></span>
                    </div>
                    <div class="score-side score-rival">
                        <span class="score-name" id="rivalName">Rival</span>
                        <span class="score-value" id="rivalScore">0</span>
                    </div>
                </div>

                <div class="arena" id="arena">
                    <div class="card card-you" id="cardYou">
                        <div class="card-face card-back">
                            <i data-lucide="help-circle"></i>
                            <span class="card-check"><i data-lucide="check"></i></span>
                        </div>
                        <div class="card-face card-front" id="youFront"></div>
                    </div>

                    <div class="arena-center" id="arenaCenter"></div>

                    <div class="card card-rival" id="cardRival">
                        <div class="card-face card-back">
                            <i data-lucide="help-circle"></i>
                            <span class="card-check"><i data-lucide="check"></i></span>
                        </div>
                        <div class="card-face card-front" id="rivalFront"></div>
                    </div>
                </div>

                <div class="status-text" id="statusText">
                    <i data-lucide="hand-pointer"></i>
                    <span>Elegí tu jugada</span>
                </div>

                <div class="choices" id="choices">
                    <button class="choice-btn" data-choice="rock">
                        <span class="choice-icon"><i data-lucide="gem"></i></span>
                        <span class="choice-label">Piedra</span>
                    </button>
                    <button class="choice-btn" data-choice="paper">
                        <span class="choice-icon"><i data-lucide="file-text"></i></span>
                        <span class="choice-label">Papel</span>
                    </button>
                    <button class="choice-btn" data-choice="scissors">
                        <span class="choice-icon"><i data-lucide="scissors"></i></span>
                        <span class="choice-label">Tijera</span>
                    </button>
                </div>

                <div class="actions" id="actions" hidden>
                    <button class="btn-secondary" id="btnBackMenu">
                        <i data-lucide="home"></i>
                        <span>Menú</span>
                    </button>
                    <button class="btn-primary" id="btnRematch">
                        <i data-lucide="rotate-ccw"></i>
                        <span id="btnRematchText">Revancha</span>
                    </button>
                </div>

            </div>
        </div>

    </main>

</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script src="script.js"></script>

<!-- Rellena el badge del header con los datos del usuario -->
<script>
(function () {
    try {
        const api = window.parent && window.parent.__vicwebos;
        const user = api && typeof api.obtenerCuenta === 'function'
            ? api.obtenerCuenta()
            : null;
        const badge = document.getElementById('rpsUserBadge');
        if (badge && user) {
            badge.textContent = '@' + user.codigo + ' · ' + (user.nombre || '');
        }
    } catch (e) { /* silencioso */ }
})();
</script>

<script>lucide.createIcons();</script>
</body>
</html>
