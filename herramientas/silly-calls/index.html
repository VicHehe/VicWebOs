<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SillyCalls</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="container">

    <!-- ===== PANTALLA DE UNIÓN ===== -->
    <div id="joinScreen" class="screen active">
        <div class="join-card">
            <div class="header-icon">
                <i data-lucide="phone-call"></i>
            </div>
            <h1>SillyCalls</h1>
            <p class="subtitle">Llamadas en tiempo real para el universo compartido</p>

            <div class="form-group">
                <label for="roomInput">Código de la sala</label>
                <input type="text" id="roomInput" placeholder="Ej: 0308" maxlength="20" />
                <small>Usa el código de tu pareja o el tuyo propio</small>
            </div>

            <div class="form-group">
                <label>Tu rol en la llamada</label>
                <div class="role-selector">
                    <label class="role-card">
                        <input type="radio" name="role" value="host" checked />
                        <span class="role-label">
                            <strong><i data-lucide="crown"></i> Anfitrión</strong>
                            <small>Crear sala</small>
                        </span>
                    </label>
                    <label class="role-card">
                        <input type="radio" name="role" value="guest" />
                        <span class="role-label">
                            <strong><i data-lucide="users"></i> Invitado</strong>
                            <small>Unirse a sala</small>
                        </span>
                    </label>
                </div>
            </div>

            <button id="btnJoin" class="btn-primary">
                <i data-lucide="phone"></i>
                Unirse / Crear
            </button>
            <div id="joinMessage" class="message"></div>
        </div>
    </div>

    <!-- ===== PANTALLA DE LLAMADA ===== -->
    <div id="callScreen" class="screen">

        <!-- Sidebar izquierda (participantes) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">
                    <i data-lucide="phone-call"></i>
                    SillyCalls
                </span>
                <span id="participantCount" class="participant-badge">
                    <i data-lucide="users"></i>
                    <span>1</span>
                </span>
            </div>
            <div class="sidebar-room">
                <span id="roomDisplay">Sala: ---</span>
            </div>
            <div class="sidebar-section-label">Participantes</div>
            <div id="participantList" class="participant-list"></div>
        </aside>

        <!-- Área central de videos -->
        <main class="call-main">
            <div id="videosContainer" class="videos-container">
                <div id="videosGrid" class="videos-grid"></div>
            </div>

            <!-- Barra de controles inferior -->
            <div class="call-controls">
                <div class="controls-left">
                    <span class="ctrl-room-label" id="ctrlRoomLabel">---</span>
                </div>
                <div class="controls-center">
                    <button id="btnMuteAudio" class="ctrl-btn" title="Silenciar micrófono">
                        <i data-lucide="mic"></i>
                        <span class="badge"><i data-lucide="x"></i></span>
                    </button>
                    <button id="btnMuteVideo" class="ctrl-btn" title="Cámara">
                        <i data-lucide="video"></i>
                        <span class="badge"><i data-lucide="x"></i></span>
                    </button>
                    <button id="btnShareScreen" class="ctrl-btn" title="Compartir pantalla">
                        <i data-lucide="monitor-up"></i>
                    </button>
                    <button id="btnHangup" class="ctrl-btn ctrl-hangup" title="Colgar">
                        <i data-lucide="phone-off"></i>
                    </button>
                </div>
                <div class="controls-right">
                    <button id="btnToggleChat" class="ctrl-btn ctrl-chat" title="Chat">
                        <i data-lucide="message-circle"></i>
                        <span class="chat-badge"></span>
                    </button>
                </div>
            </div>
        </main>

        <!-- Panel de chat (derecha, toggle) -->
        <aside id="chatPanel" class="chat-panel hidden">
            <div class="chat-panel-header">
                <span><i data-lucide="message-circle"></i> Chat</span>
                <button id="btnCloseChat" class="btn-close-chat"><i data-lucide="x"></i></button>
            </div>
            <div id="chatMessages" class="chat-messages">
                <div class="chat-empty">Los mensajes aparecerán aquí</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Escribe algo..." maxlength="300" />
                <button id="btnSendChat" class="btn-send"><i data-lucide="send"></i></button>
            </div>
        </aside>

    </div><!-- fin callScreen -->
</div>

<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script src="script.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
