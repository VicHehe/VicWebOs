<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tres en Raya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="tr-container">

        <header class="tr-header">
            <div class="tr-logo">
                <div class="tr-logo-mark">
                    <i data-lucide="grid-3x3"></i>
                </div>
                <div class="tr-logo-text">
                    <h1>Tres en Raya</h1>
                    <p id="trUserBadge">—</p>
                </div>
            </div>
        </header>

        <div class="tr-info">
            <div class="tr-info-chip tr-info-turno" id="trInfoTurno">
                <i data-lucide="circle-dot"></i>
                <span>Tu turno</span>
            </div>
            <div class="tr-info-chip tr-info-ronda facil" id="trInfoRonda">
                <i data-lucide="target"></i>
                <span id="trInfoRondaTexto">Ronda 1/3</span>
                <em id="trInfoRondaDif">Fácil</em>
            </div>
        </div>

        <div class="tr-tablero" id="trTablero">
            <button class="tr-celda" data-idx="0"></button>
            <button class="tr-celda" data-idx="1"></button>
            <button class="tr-celda" data-idx="2"></button>
            <button class="tr-celda" data-idx="3"></button>
            <button class="tr-celda" data-idx="4"></button>
            <button class="tr-celda" data-idx="5"></button>
            <button class="tr-celda" data-idx="6"></button>
            <button class="tr-celda" data-idx="7"></button>
            <button class="tr-celda" data-idx="8"></button>
        </div>

        <div class="tr-stats">
            <div class="tr-stat">
                <span class="tr-stat-label">Ciclos</span>
                <span class="tr-stat-valor" id="trStatCiclos">0</span>
            </div>
            <div class="tr-stat">
                <span class="tr-stat-label">Monedas</span>
                <span class="tr-stat-valor" id="trStatMonedas">0</span>
            </div>
        </div>

    </div>

    <!-- Overlay de inicio -->
    <div class="tr-overlay" id="trOverlayStart">
        <div class="tr-overlay-card">
            <div class="tr-overlay-icono">
                <i data-lucide="target"></i>
            </div>
            <h2>Gana 3 rondas seguidas</h2>
            <p>La dificultad sube en cada ronda. Complétalas todas y llévate <strong>15 monedas</strong>.</p>
            <div class="tr-rondas">
                <div class="tr-ronda-chip"><span>1</span>Fácil</div>
                <div class="tr-ronda-chip"><span>2</span>Media</div>
                <div class="tr-ronda-chip"><span>3</span>Difícil</div>
            </div>
            <button class="tr-btn-primario" id="trBtnEmpezar">
                <i data-lucide="play"></i>
                Empezar
            </button>
        </div>
    </div>

    <!-- Overlay de fin de ciclo / derrota -->
    <div class="tr-overlay" id="trOverlayFin" hidden>
        <div class="tr-overlay-card">
            <div class="tr-overlay-icono" id="trFinIcono">
                <i data-lucide="trophy"></i>
            </div>
            <h2 id="trFinTitulo">¡Ciclo completado!</h2>
            <p id="trFinSubtitulo">Ganaste las 3 rondas.</p>

            <div class="tr-resumen">
                <div class="tr-resumen-fila">
                    <span class="tr-resumen-label">Rondas superadas</span>
                    <span class="tr-resumen-valor" id="trFinRondas">3/3</span>
                </div>
                <div class="tr-resumen-fila tr-resumen-destacada" id="trFinMonedasFila">
                    <span class="tr-resumen-label">
                        <i data-lucide="coins"></i>
                        Recompensa
                    </span>
                    <span class="tr-resumen-valor tr-resumen-monedas" id="trFinMonedas">+15</span>
                </div>
            </div>

            <button class="tr-btn-primario" id="trBtnReintentar">
                <i data-lucide="rotate-ccw" id="trBtnReintentarIcono"></i>
                <span id="trBtnReintentarTexto">Jugar otra vez</span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
