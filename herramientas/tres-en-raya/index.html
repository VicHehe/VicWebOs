<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tres en Raya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="tr-container">

        <header class="tr-header">
            <div class="tr-logo">
                <div class="tr-logo-mark">
                    <i data-lucide="grid-3x3"></i>
                </div>
                <div class="tr-logo-text">
                    <h1>Tres en Raya</h1>
                    <p id="trUserBadge">—</p>
                </div>
            </div>
            <div class="tr-racha-badge" id="trRachaBadge">
                <i data-lucide="flame"></i>
                <span id="trRachaActual">0</span>
            </div>
        </header>

        <div class="tr-info">
            <div class="tr-info-chip tr-info-turno" id="trInfoTurno">
                <i data-lucide="circle-dot"></i>
                <span>Tu turno</span>
            </div>
            <div class="tr-info-chip tr-info-nivel" id="trInfoNivel" title="Dificultad actual">
                <i data-lucide="cpu"></i>
                <span>Nivel 1</span>
                <em id="trInfoNivelProgreso">1/3</em>
            </div>
        </div>

        <div class="tr-tablero" id="trTablero">
            <button class="tr-celda" data-idx="0"></button>
            <button class="tr-celda" data-idx="1"></button>
            <button class="tr-celda" data-idx="2"></button>
            <button class="tr-celda" data-idx="3"></button>
            <button class="tr-celda" data-idx="4"></button>
            <button class="tr-celda" data-idx="5"></button>
            <button class="tr-celda" data-idx="6"></button>
            <button class="tr-celda" data-idx="7"></button>
            <button class="tr-celda" data-idx="8"></button>
        </div>

        <div class="tr-stats">
            <div class="tr-stat">
                <span class="tr-stat-label">Racha</span>
                <span class="tr-stat-valor" id="trStatRacha">0</span>
            </div>
            <div class="tr-stat">
                <span class="tr-stat-label">Récord</span>
                <span class="tr-stat-valor" id="trStatRecord">0</span>
            </div>
            <div class="tr-stat">
                <span class="tr-stat-label">Ganadas</span>
                <span class="tr-stat-valor" id="trStatGanadas">0</span>
            </div>
            <div class="tr-stat">
                <span class="tr-stat-label">Monedas</span>
                <span class="tr-stat-valor" id="trStatMonedas">0</span>
            </div>
        </div>

    </div>

    <!-- ============================================================
         OVERLAY DE INICIO — pantalla completa
         ============================================================ -->
    <div class="tr-overlay" id="trOverlayStart">
        <div class="tr-overlay-card">
            <div class="tr-overlay-icono">
                <i data-lucide="grid-3x3"></i>
            </div>
            <h2>¿Listo para jugar?</h2>
            <p>Consigue <strong>3 en línea</strong> antes que la CPU. Gana partidas seguidas para subir de nivel.</p>
            <button class="tr-btn-primario" id="trBtnEmpezar">
                <i data-lucide="play"></i>
                Empezar
            </button>
        </div>
    </div>

    <!-- ============================================================
         OVERLAY DE FIN DE PARTIDA — resultado + stats + botón
         ============================================================ -->
    <div class="tr-overlay" id="trOverlayFin" hidden>
        <div class="tr-overlay-card">
            <div class="tr-overlay-icono" id="trFinIcono">
                <i data-lucide="trophy"></i>
            </div>
            <h2 id="trFinTitulo">¡Ganaste!</h2>
            <p id="trFinSubtitulo">Racha ×1. ¡Sigue así!</p>

            <div class="tr-resumen">
                <div class="tr-resumen-fila">
                    <span class="tr-resumen-label">Racha actual</span>
                    <span class="tr-resumen-valor" id="trFinRacha">0</span>
                </div>
                <div class="tr-resumen-fila">
                    <span class="tr-resumen-label">Récord</span>
                    <span class="tr-resumen-valor" id="trFinRecord">0</span>
                </div>
                <div class="tr-resumen-fila">
                    <span class="tr-resumen-label">Ganadas</span>
                    <span class="tr-resumen-valor" id="trFinGanadas">0</span>
                </div>
                <div class="tr-resumen-fila tr-resumen-destacada" id="trFinMonedasFila">
                    <span class="tr-resumen-label">
                        <i data-lucide="coins"></i>
                        Monedas ganadas
                    </span>
                    <span class="tr-resumen-valor tr-resumen-monedas" id="trFinMonedas">+0</span>
                </div>
            </div>

            <button class="tr-btn-primario" id="trBtnReintentar">
                <i data-lucide="rotate-ccw" id="trBtnReintentarIcono"></i>
                <span id="trBtnReintentarTexto">Reintentar</span>
            </button>
        </div>
    </div>

    <div class="tr-toast" id="trToast"></div>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
