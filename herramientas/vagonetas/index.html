<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vagonetas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="vg-app">

    <header class="vg-header">
        <div class="vg-logo">
            <div class="vg-logo-mark"><i data-lucide="flag"></i></div>
            <div class="vg-logo-text">
                <h1>Vagonetas</h1>
                <p id="vgUserBadge">—</p>
            </div>
        </div>
        <div class="vg-racha" title="Días seguidos jugando">
            <i data-lucide="flame"></i>
            <span id="vgRacha">1</span>
            <em>día</em>
        </div>
    </header>

    <div class="vg-hud">
        <div class="vg-hud-pos" id="vgHudPos">
            <span class="vg-hud-pos-num" id="vgHudPosNum">—</span>
            <span class="vg-hud-pos-ord">º</span>
        </div>
        <div class="vg-hud-dist">
            <i data-lucide="flag"></i>
            <span id="vgHudDist">0 / 550m</span>
        </div>
        <div class="vg-hud-time">
            <i data-lucide="timer"></i>
            <span id="vgHudTime">0.0s</span>
        </div>
    </div>

    <div class="vg-canvas-wrap">
        <div class="vg-canvas" id="vgCanvas"></div>

        <div class="vg-tap-zone vg-tap-left"  data-dir="left"  aria-label="Ir a la izquierda"></div>
        <div class="vg-tap-zone vg-tap-right" data-dir="right" aria-label="Ir a la derecha"></div>

        <div class="vg-overlay vg-countdown" id="vgCountdown" hidden>
            <div class="vg-countdown-num" id="vgCountdownNum">3</div>
        </div>

        <div class="vg-overlay vg-pos-live" id="vgPosLive" hidden>
            <div class="vg-pos-item" data-pos="1">
                <span class="vg-pos-num">1º</span>
                <span class="vg-pos-name" id="vgPos1">—</span>
            </div>
            <div class="vg-pos-item" data-pos="2">
                <span class="vg-pos-num">2º</span>
                <span class="vg-pos-name" id="vgPos2">—</span>
            </div>
            <div class="vg-pos-item" data-pos="3">
                <span class="vg-pos-num">3º</span>
                <span class="vg-pos-name" id="vgPos3">—</span>
            </div>
        </div>
    </div>

</div>

<!-- ========== PANTALLA: SELECCIÓN DE MAPA ========== -->
<div class="vg-screen" id="vgScreenStart">
    <div class="vg-screen-card">
        <div class="vg-screen-icono"><i data-lucide="flag"></i></div>
        <h2>Vagonetas</h2>
        <p>Carreras 3D de vagonetas. Elegí un circuito y llegá primero a la meta.</p>

        <div class="vg-mapas-seccion">
            <div class="vg-mapas-titulo">
                <i data-lucide="map"></i>
                <span>Circuitos disponibles</span>
            </div>
            <div class="vg-mapas-grid" id="vgMapasGrid"></div>
        </div>

        <button class="vg-btn-pri" id="vgBtnEmpezar" disabled>
            <i data-lucide="play"></i>
            <span>Elegí un circuito</span>
        </button>

        <div class="vg-racha-info">
            <i data-lucide="flame"></i>
            <span id="vgRachaInfo">—</span>
        </div>
    </div>
</div>

<!-- ========== PANTALLA: FIN DE CARRERA ========== -->
<div class="vg-screen" id="vgScreenFin" hidden>
    <div class="vg-screen-card">
        <div class="vg-screen-icono" id="vgFinIcono"><i data-lucide="trophy"></i></div>
        <h2 id="vgFinTitulo">¡Primer lugar!</h2>
        <p id="vgFinSubtitulo">—</p>

        <div class="vg-fin-resumen">
            <div class="vg-fin-fila">
                <span>Posición</span>
                <strong id="vgFinPos">1º</strong>
            </div>
            <div class="vg-fin-fila">
                <span>Tiempo</span>
                <strong id="vgFinTiempo">0.0s</strong>
            </div>
            <div class="vg-fin-fila">
                <span>Circuito</span>
                <strong id="vgFinMapa">—</strong>
            </div>
            <div class="vg-fin-fila">
                <span>Racha</span>
                <strong id="vgFinRacha">1 día</strong>
            </div>
            <div class="vg-fin-fila vg-fin-destacada">
                <span><i data-lucide="coins"></i> Recompensa</span>
                <strong id="vgFinMonedas">+10</strong>
            </div>
        </div>

        <div class="vg-fin-acciones">
            <button class="vg-btn-sec" id="vgBtnCambiarMapa">
                <i data-lucide="map"></i>
                <span>Otro mapa</span>
            </button>
            <button class="vg-btn-pri" id="vgBtnReintentar">
                <i data-lucide="rotate-ccw"></i>
                <span>Reintentar</span>
            </button>
        </div>
    </div>
</div>

<div class="vg-toast" id="vgToast"></div>

<script src="mapas.js"></script>
<script src="escena.js"></script>
<script src="script.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
