<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wiki Lector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="wiki-widget">
        <!-- HEADER -->
        <div class="wiki-header">
            <div class="wiki-titulo">
                <i data-lucide="book-open"></i>
                <span>Wiki Lector</span>
            </div>
            <div class="wiki-header-acciones">
                <span class="wiki-badge">es.wikipedia.org</span>
            </div>
        </div>

        <!-- INPUT ZONA -->
        <div class="wiki-input-wrap">
            <input type="text" id="wikiInput" class="wiki-input" placeholder="Buscar artículo..." autocomplete="off">
            <button class="wiki-btn-search" id="wikiBtnSearch" title="Buscar">
                <i data-lucide="search"></i>
            </button>
        </div>

        <!-- LISTA / RESULTADO ZONA -->
        <div class="wiki-zona" id="wikiZona">
            <div class="wiki-estado">
                <i data-lucide="compass"></i>
                <p>Busca un concepto, lugar o personaje histórico para empezar.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
